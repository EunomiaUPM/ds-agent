# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace]
members = [
    "crates/monolith",
    "crates/dataplane",
    "crates/common",
    "crates/auth",
    "crates/events",
    "crates/bff",
    "crates/catalog-agent",
    "crates/negotiation-agent",
    "crates/transfer-agent",
    "crates/connector",
    "crates/transfer-agent-ref",
    "crates/oauth",
    "crates/connector",
    "crates/keystore",
]
exclude = [
    "static",
    "gui",
    "deployment",
]
resolver = "2"


[workspace.dependencies]
serde = { version = "1.0.203", features = ["default", "derive"] }
serde_json = { version = "1.0.117", features = ["default"] }
clap = { version = "4.4.9", features = [
    "env",
    "derive",
    "wrap_help",
    "unicode",
] }
base64 = "0.22.1"
tokio = { version = "1.35.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8.8", features = ["ws"] }
tower-http = { version = "0.6.2", features = ["trace", "cors", "fs"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "form", "rustls", "http2"] }
dotenvy = "0.15"
once_cell = "1.19.0"
thiserror = "2.0.12"
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.8.0", features = ["serde", "default", "v4", "v5"] }
urn = { version = "0.7.0", features = ["serde"] }
log = "0.4.21"
http-body-util = "0.1.2"
sea-orm = { version = "1.1.1", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio", "macros", "with-json", "serde_json"] }
sea-orm-migration = { version = "1.1.1" }
json_to_table = "0.12.0"
mockall = "0.14.0"
url = { version = "2.5.4", features = ["default"] }
urlencoding = { version = "2.1.3" }
sha2 = "0.10.9"
rand = "0.10.0"
jsonwebtoken = "10.3.0"
json_value_merge = "2.0.1"
serde_norway = "0.9.42"
rustls = { version = "0.23", features = ["ring"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
futures-util = "0.3.31"
http-body = "1.0.1"
fs_extra = { version = "1.3.0" }
mime_guess = "2.0"
rust-embed = "8.3"
async-trait = "0.1.89"
hyper = { version = "1.5.0", features = ["full"] }
strum = { version = "0.26.1", features = ["derive"] }
jaq-interpret = "1.5.0"
jaq-parse = "1.0.3"
bytes = "1.10.1"
serde_urlencoded = "0.7.1"
tokio-util = "0.7.17"
tonic = "0.14.2"
prost = "0.14.1"
tonic-prost = "0.14.2"
prost-types = "0.14.1"
tonic-reflection = "0.14.2"
convert_case = "0.11.0"
redis = { version = "1.0.2", features = ["default", "aio", "tokio-comp", "json"] }
regex = "1.12.2"
tonic-prost-build = "0.14.5"
compact_str = { version = "0.8", features = ["serde"] }
argon2 = "0.5.3"
ymir = {git = "https://github.com/EunomiaUPM/ymir.git", tag = "v0.8.1"}
#ymir = { path = "./../ymir" }
