# https://taskfile.dev
version: '3'

includes:
  docker:
    taskfile: ./scripts/Taskfile.docker.yml
    dir: .
  env:
    taskfile: ./scripts/Taskfile.dev.yml
    dir: .
  deployment:
    taskfile: ./deployment/Taskfile.deployment.yml
    dir: .

tasks:
  banner:
    desc: Add license header to all source files
    cmds:
      - bash ./scripts/tools/add_license.sh .

  openapi:
    desc: Build the JSON specs and merged_openapi from static/specs/openapi/*/*.yaml
    cmds:
      - python3 scripts/tools/build-openapi.py

  test:integration:
    desc: Integration tests in monolith, against the provider dev Postgres and Redis
    env:
      DATABASE_URL: '{{.DATABASE_URL | default "postgres://mini_provider:mini_provider@localhost:1400/mini_provider"}}'
      REDIS_URL: '{{.REDIS_URL | default "redis://:ds_core_provider_redis@localhost:6379"}}'
    cmds:
      - docker compose -f deployment/dev/docker-compose.mini.dev.provider.yaml up -d --wait provider-db provider-redis
      - cargo test -p monolith --test dsp --test cache -- --ignored

  test:onboarding:
    desc: SSI onboarding test in monolith, against the running dev stack (authority, consumer, provider)
    cmds:
      - cargo test -p monolith --test auth -- --ignored

  examples:up:
    desc: Build/start the self-contained Provider + Consumer + Mock Backend stack and onboard peers
    cmds:
      - docker compose -f examples/docker-compose.yaml up -d --build --wait
      - ./examples/scripts/onboard.sh

  examples:pull:
    desc: Run the reproducible EDACCIT-style HTTP PULL example against the examples stack
    cmds:
      - ./examples/scripts/pull-demo.sh

  examples:pull-finite:
    desc: Run the reproducible single-shot FINITE HTTP PULL example (auto-completion over DSP)
    cmds:
      - ./examples/scripts/pull-finite-demo.sh

  examples:push:
    desc: Run the reproducible ECOSTARS-style HTTP PUSH example against the examples stack
    cmds:
      - ./examples/scripts/push-demo.sh

  examples:kafka:
    desc: Start the optional Redpanda broker and run the end-to-end Kafka -> HTTP PUSH relay demo
    cmds:
      - docker compose -f examples/docker-compose.yaml --profile kafka up -d --wait redpanda
      - ./examples/scripts/kafka-push-demo.sh

  examples:down:
    desc: Stop and remove the reproducible examples stack and volumes
    cmds:
      - docker compose -f examples/docker-compose.yaml --profile kafka down -v
