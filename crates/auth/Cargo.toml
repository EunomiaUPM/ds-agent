[package]
name = "auth"
version = "0.4.0"
edition = "2021"



[lib]
name = "auth"
path = "src/lib.rs"

[[bin]]
name = "auth"
path = "src/main.rs"

[dependencies]
common = { version = "0.4.0", path = "../common", default-features = true }
events = { version = "0.4.0", path = "../events", default-features = false }
# oauth = { version = "0.4.0", path = "../oauth" }  # disabled, see the workspace Cargo.toml

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "full"] }
tokio-util = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sea-orm = { workspace = true }
sha2 = { workspace = true }
sea-orm-migration = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
async-trait = {workspace = true}
ymir = { workspace = true }
json_value_merge = {workspace = true}
mockall = { workspace = true }

[dev-dependencies]
ymir = { workspace = true, features = ["mock"] }
serde_urlencoded = { workspace = true }