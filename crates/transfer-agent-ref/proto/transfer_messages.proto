syntax = "proto3";
package transfer_messages_ref;

// Enums ──────────────────────────────────────────────────────────────────

enum Direction {
  INBOUND = 0;
  OUTBOUND = 1;
}

// Nested types ───────────────────────────────────────────────────────────

message MessageEnvelope {
  string payload = 1;              // protocol message as JSON, verbatim
  string canonical_form = 2;       // N-Quads text; "" = absent (non-RDF protocols)
  string canonical_hash = 3;       // "" = absent; hex SHA-256
}

// Response types ─────────────────────────────────────────────────────────

message TransferMessageResponse {
  string id = 1;
  string transfer_process_id = 2;
  string tenant_id = 3;
  Direction direction = 4;
  string protocol = 5;
  string message_type = 6;
  string state_transition_from = 7;
  string state_transition_to = 8;
  MessageEnvelope envelope = 9;
  string occurred_at = 10;      // RFC3339
}

message TransferMessageListResponse {
  repeated TransferMessageResponse items = 1;
  string next_cursor = 2; // "" = no next page
  uint64 total = 3;       // 0 = unknown
}

message DeleteResponse {}

// Request types ──────────────────────────────────────────────────────────

// Auth: authorization Bearer <token> + x-tenant-id metadata headers required.
// Filter strings: send "" to omit a filter. Pagination: limit=0 defaults to 20.
message ListTransferMessagesRequest {
  string direction = 1;          // "" = any; "inbound" | "outbound"
  string protocol = 2;           // "" = any
  string state_transition_to = 3; // "" = any
  string created_after = 4;      // "" = no lower bound; RFC3339
  string created_before = 5;     // "" = no upper bound; RFC3339
  uint32 limit = 6;              // 0 → default 20
  string cursor = 7;             // "" = first page
  string sort = 8;               // "" → "created_at_desc"
}

message ListTransferMessagesByProcessRequest {
  string process_id = 1;
  string direction = 2;
  string protocol = 3;
  string state_transition_to = 4;
  string created_after = 5;
  string created_before = 6;
  uint32 limit = 7;
  string cursor = 8;
  string sort = 9;
}

message ResourceIdRequest {
  string id = 1;
}

message CreateTransferMessageRequest {
  string transfer_process_id = 1;
  Direction direction = 2;
  string protocol = 3;
  string message_type = 4;
  string state_transition_from = 5;
  string state_transition_to = 6;
  string payload = 7;              // protocol message as JSON; "" = absent
  string canonical_form = 8;       // N-Quads text; "" = absent
}

// Service ────────────────────────────────────────────────────────────────

service TransferMessagesRef {
  rpc ListTransferMessages(ListTransferMessagesRequest) returns (TransferMessageListResponse);
  rpc ListTransferMessagesByProcess(ListTransferMessagesByProcessRequest) returns (TransferMessageListResponse);
  rpc GetTransferMessage(ResourceIdRequest) returns (TransferMessageResponse);
  rpc CreateTransferMessage(CreateTransferMessageRequest) returns (TransferMessageResponse);
  rpc DeleteTransferMessage(ResourceIdRequest) returns (DeleteResponse);
}
