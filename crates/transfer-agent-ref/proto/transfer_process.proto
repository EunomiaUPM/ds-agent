syntax = "proto3";
package transfer_processes_ref;

// Enums ──────────────────────────────────────────────────────────────────

enum TransferRole {
  PROVIDER = 0;
  CONSUMER = 1;
  RELAY = 2;
}

enum ProtocolId {
  DSP2024 = 0;
  DSP2025_1 = 1;
}

// Nested types ───────────────────────────────────────────────────────────

message StateMetadata {
  string attribute = 1; // "" = absent
  repeated string reason = 2;
  string code = 3;      // "" = absent
}

message TransferCorrelation {
  string identifiers = 1;         // JSON blob; "" = absent
  string consumer_pid = 2;        // "" = absent
  string provider_pid = 3;        // "" = absent
  string agreement_id = 4;        // "" = absent
  string callback_address = 5;    // "" = absent
  string peer_participant_id = 6; // "" = absent
}

// Response types ─────────────────────────────────────────────────────────

message TransferProcessResponse {
  string id = 1;
  string tenant_id = 2;
  TransferRole role = 3;
  ProtocolId protocol = 4;
  string state = 5;
  StateMetadata state_metadata = 6;
  TransferCorrelation correlation = 7;
  string properties = 8;     // JSON blob
  string error_details = 9;  // JSON blob; "" = absent
  string created_at = 10;    // RFC3339
  string updated_at = 11;    // RFC3339
  uint64 version = 12;
}

message TransferProcessListResponse {
  repeated TransferProcessResponse items = 1;
  string next_cursor = 2; // "" = no next page
  uint64 total = 3;       // 0 = unknown
}

message DeleteResponse {}

// Request types ──────────────────────────────────────────────────────────

// Auth: authorization Bearer <token> + x-tenant-id metadata headers required.
// Filter strings: send "" to omit a filter. Pagination: limit=0 defaults to 20.
message ListTransferProcessesRequest {
  string protocol = 1;           // "" = any; "dsp2024" | "dsp2025_1"
  string state = 2;              // "" = any
  string role = 3;               // "" = any; "provider" | "consumer" | "relay"
  string agreement_id = 4;       // "" = any; URN string
  string peer_participant_id = 5; // "" = any; URN string
  string created_after = 6;      // "" = no lower bound; RFC3339
  string created_before = 7;     // "" = no upper bound; RFC3339
  uint32 limit = 8;              // 0 → default 20
  string cursor = 9;             // "" = first page
  string sort = 10;              // "" → "created_at_desc"; "created_at_asc" | "updated_at_desc"
}

message ResourceIdRequest {
  string id = 1;
}

message BatchTransferProcessesRequest {
  repeated string ids = 1;
}

message CreateTransferProcessRequest {
  TransferRole role = 1;
  ProtocolId protocol = 2;
  string initial_state = 3;
  string agreement_id = 4;
  string peer_participant_id = 5;
  string callback_address = 6;         // "" = absent
  string identifiers = 7;           // JSON blob; "" = absent
  string properties = 8;               // JSON blob; "" = absent
  string initial_state_attribute = 9;  // "" = absent
  string initial_state_code = 10;      // "" = absent
  repeated string initial_state_reasons = 11;
}

message EditTransferProcessRequest {
  string id = 1;
  string state = 2;              // "" = no change
  string identifiers = 3;           // JSON blob; "" = absent
  string properties = 4;         // JSON blob; "" = no change
  string error_details = 5;      // JSON blob; "" = no change
  string state_attribute = 6;    // "" = absent
  string state_code = 7;         // "" = absent
  repeated string state_reasons = 8;
}

// Service ────────────────────────────────────────────────────────────────

service TransferProcessesRef {
  rpc ListTransferProcesses(ListTransferProcessesRequest) returns (TransferProcessListResponse);
  rpc GetTransferProcess(ResourceIdRequest) returns (TransferProcessResponse);
  rpc BatchGetTransferProcesses(BatchTransferProcessesRequest) returns (TransferProcessListResponse);
  rpc CreateTransferProcess(CreateTransferProcessRequest) returns (TransferProcessResponse);
  rpc EditTransferProcess(EditTransferProcessRequest) returns (TransferProcessResponse);
  rpc DeleteTransferProcess(ResourceIdRequest) returns (DeleteResponse);
}
