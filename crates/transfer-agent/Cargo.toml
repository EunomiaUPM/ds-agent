[package]
name = "transfer_agent"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "transfer_agent"
path = "src/lib.rs"

[[bin]]
name = "transfer_agent"
path = "src/main.rs"

[dependencies]
common = { version = "0.4.0", path = "../common", default-features = false }
connector = { version = "0.4.0", path = "../connector", default-features = false }
# oauth = { package = "ymir-oauth", git = "https://github.com/EunomiaUPM/ymir.git" }  # not built yet, see the workspace Cargo.toml
events = { workspace = true }
dataplane = { version = "0.4.0", path = "../dataplane", default-features = false }


serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
urn = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
mockall = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
tower-http = { workspace = true }
ymir = { workspace = true }
url = { version = "2.5.7", features = ["serde"] }
bytes = { workspace = true }
compact_str = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = "0.4"
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }
prost-types = { workspace = true }
tonic-reflection = { workspace = true }
http = "1.3.1"

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
