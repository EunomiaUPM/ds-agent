# Opt-in tracing/metrics backend shared by the consumer and provider agents running on the host.
# Start it, then export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 before running an agent.
#   docker compose -f docker-compose.observability.yaml up -d
# Traces: Jaeger UI at http://localhost:16686 · Metrics: Prometheus at http://localhost:9090
# Dashboards: Grafana at http://localhost:3000 (anonymous admin, datasources pre-provisioned)
name: observability-dev

services:
  otel-collector:
    container_name: "otel-collector"
    image: "otel/opentelemetry-collector-contrib:0.136.0"
    restart: always
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (agents export here)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint for agent metrics
    depends_on:
      - jaeger

  jaeger:
    container_name: "jaeger"
    image: "jaegertracing/jaeger:2.10.0"
    restart: always
    ports:
      - "16686:16686" # Jaeger UI

  prometheus:
    container_name: "prometheus"
    image: "prom/prometheus:v3.6.0"
    restart: always
    command: [ "--config.file=/etc/prometheus/prometheus.yaml" ]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    container_name: "grafana"
    image: "grafana/grafana:12.2.0"
    restart: always
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/agents.json"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
