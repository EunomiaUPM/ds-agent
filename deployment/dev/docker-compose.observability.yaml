# Opt-in tracing/metrics/logs/Kafka backend shared by consumer, provider, and heimdall agents.
# Start OTLP + Loki + Jaeger + Prometheus + Grafana:
#   docker compose -f docker-compose.observability.yaml up -d
# Start with optional Kafka event backbone (localhost:9092):
#   docker compose -f docker-compose.observability.yaml --profile kafka up -d
# Traces: Jaeger UI at http://localhost:16686 · Metrics: Prometheus at http://localhost:9090
# Logs: Loki at http://localhost:3100 · Dashboards: Grafana at http://localhost:3000
name: observability-dev

services:
  otel-collector:
    container_name: "otel-collector"
    image: "otel/opentelemetry-collector-contrib:0.136.0"
    restart: always
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (agents export here)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint for agent metrics
    depends_on:
      - jaeger
      - loki

  jaeger:
    container_name: "jaeger"
    image: "jaegertracing/jaeger:2.10.0"
    restart: always
    ports:
      - "16686:16686" # Jaeger UI

  loki:
    container_name: "loki"
    image: "grafana/loki:3.4.2"
    restart: always
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "3100:3100"

  prometheus:
    container_name: "prometheus"
    image: "prom/prometheus:v3.6.0"
    restart: always
    command: [ "--config.file=/etc/prometheus/prometheus.yaml" ]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    container_name: "grafana"
    image: "grafana/grafana:12.2.0"
    restart: always
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/agents.json"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
      - loki

  # Optional dataspace event backbone; disabled unless started with `--profile kafka`.
  kafka:
    container_name: "observability-kafka"
    image: "apache/kafka:3.9.0"
    profiles: [ "kafka" ]
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
