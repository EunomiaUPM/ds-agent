# Opt-in tracing/metrics backend shared by the consumer and provider agents running on the host.
# Start it, then export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 before running an agent.
#   docker compose -f docker-compose.observability.yaml up -d
# Traces: Jaeger UI at http://localhost:16686 · Metrics: Prometheus format at http://localhost:8889/metrics
name: observability-dev

services:
  otel-collector:
    container_name: "otel-collector"
    image: "otel/opentelemetry-collector-contrib:0.136.0"
    restart: always
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (agents export here)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint for agent metrics
    depends_on:
      - jaeger

  jaeger:
    container_name: "jaeger"
    image: "jaegertracing/jaeger:2.10.0"
    restart: always
    ports:
      - "16686:16686" # Jaeger UI
