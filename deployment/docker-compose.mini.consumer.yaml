name: mini-consumer

services:
  consumer-db:
    container_name: "consumer-db"
    image: "postgres"
    restart: always
    env_file:
      - ./../static/environment/envs/consumer.db.env.example
    ports:
      - "1300:5432"

  consumer-redis:
    image: redis:alpine
    restart: always
    container_name: consumer-redis
    ports:
      - "6380:6379"
    command: >
      redis-server 
      --requirepass ds_core_consumer_redis
      --user admin on >ds_core_consumer_redis ~* +@all

  # =========================
  # Setup job (one-shot)
  # =========================
  consumer-setup:
    container_name: consumer-setup
    # image: rmenendez8/rainbow:v1.2.6
    image: quay.io/eunomia_upm/ds-agent-core:0.3.9
    command: ["setup", "-e", "/app/static/environment/config/core.consumer.mini.yaml"]
    volumes:
      - ./../static/:/app/static
      - ./../static/vault/consumer:/app/vault
    depends_on:
      - consumer-db
      - consumer-redis
    env_file:
      - ./../static/environment/envs/core.consumer.env.example
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================
  # Main service
  # =========================
  consumer:
    container_name: consumer
    #image: rmenendez8/rainbow:v1.2.6
    image: quay.io/eunomia_upm/ds-agent-core:0.3.9
    command: ["start", "-e", "/app/static/environment/config/core.consumer.mini.yaml"]
    ports:
      - "1100:1100"
    volumes:
      - ./../static/:/app/static
      - ./../static/vault/consumer:/app/vault
    depends_on:
      consumer-setup:
        condition: service_completed_successfully
      consumer-db:
        condition: service_started
      consumer-redis:
        condition: service_started
    env_file:
      - ./../static/environment/envs/core.consumer.env.example
    environment:
      RUST_BACKTRACE: full
    extra_hosts:
      - "host.docker.internal:host-gateway"
