[package]
name = "rainbow_transfer_agent"
version = "0.3.8"
edition = "2021"

[lib]
name = "rainbow_transfer_agent"
path = "src/lib.rs"

[[bin]]
name = "rainbow_transfer_agent"
path = "src/main.rs"

[dependencies]
rainbow_common = { version = "0.3.8", path = "../rainbow-common", default-features = false }
rainbow_events = { version = "0.3.8", path = "../rainbow-events", default-features = false }
rainbow_dataplane = { version = "0.3.8", path = "../rainbow-dataplane", default-features = false }
rainbow_negotiation_agent = { version = "0.3.8", path = "../rainbow-negotiation-agent", default-features = false }
rainbow_catalog_agent =  { version = "0.3.8", path = "../rainbow-catalog-agent", default-features = false }
rainbow_connector =  { version = "0.3.8", path = "../rainbow-connector", default-features = false }

serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
urn = { workspace = true }
log = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
mockall = { workspace = true }
async-trait = {workspace = true}
tokio-util = "0.7.17"
uuid = "1.18.1"
tower-http = { version = "0.6.6", features = ["trace"] }
tonic = "0.14.2"
prost = "0.14.1"
tonic-prost = "0.14.2"
prost-types = "0.14.1"
tonic-reflection = "0.14.2"
json_to_table = {workspace = true}
ymir = {workspace = true}


[build-dependencies]
tonic-prost-build = "0.14.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }