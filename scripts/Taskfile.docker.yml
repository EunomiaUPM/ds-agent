# https://taskfile.dev
# Docker build & push tasks — included by the root Taskfile as namespace "docker:"
#   task docker:build:core
#   task docker:push:all
version: '3'

vars:
  REGISTRY: '{{.REGISTRY | default "quay.io/eunomia_upm"}}'
  VERSION:  '{{.VERSION  | default "0.3.9"}}'
  DOCKERFILE: deployment/Dockerfile

# ─── helpers ──────────────────────────────────────────────────────────────────
# Internal macro: builds one image.
# Call via: task docker:build:core   (namespace injected by root include)
# ──────────────────────────────────────────────────────────────────────────────

tasks:
  # ─── build ──────────────────────────────────────────────────────────────────
  build:core:
    desc: "Build ds-agent-core (monolith) image"
    cmds:
      - docker build --progress plain
          -t {{.REGISTRY}}/rainbow:{{.VERSION}}
          --build-arg APP_NAME=rainbow_core
          -f {{.DOCKERFILE}} .

  build:catalog:
    desc: "Build ds-agent-catalog image"
    cmds:
      - docker build --progress plain
          -t {{.REGISTRY}}/ds-agent-catalog:{{.VERSION}}
          --build-arg APP_NAME=rainbow_catalog
          -f {{.DOCKERFILE}} .

  build:contracts:
    desc: "Build ds-agent-contracts (negotiation) image"
    cmds:
      - docker build --progress plain
          -t {{.REGISTRY}}/ds-agent-contracts:{{.VERSION}}
          --build-arg APP_NAME=rainbow_contracts
          -f {{.DOCKERFILE}} .

  build:transfer:
    desc: "Build ds-agent-transfer image"
    cmds:
      - docker build --progress plain
          -t {{.REGISTRY}}/ds-agent-transfer:{{.VERSION}}
          --build-arg APP_NAME=rainbow_transfer
          -f {{.DOCKERFILE}} .

  build:transfer-agent:
    desc: "Build ds-agent-transfer-agent image"
    cmds:
      - docker build --progress plain
          -t {{.REGISTRY}}/ds-agent-transfer-agent:{{.VERSION}}
          --build-arg APP_NAME=rainbow_transfer_agent
          -f {{.DOCKERFILE}} .

  build:auth:
    desc: "Build ds-agent-auth image"
    cmds:
      - docker build --progress plain
          -t {{.REGISTRY}}/ds-agent-auth:{{.VERSION}}
          --build-arg APP_NAME=rainbow_auth
          -f {{.DOCKERFILE}} .

  build:fe-gateway:
    desc: "Build ds-agent-fe-gateway image"
    cmds:
      - docker build --progress plain
          -t {{.REGISTRY}}/ds-agent-fe-gateway:{{.VERSION}}
          --build-arg APP_NAME=rainbow_fe_gateway
          -f {{.DOCKERFILE}} .

  build:business-gateway:
    desc: "Build ds-agent-business-gateway image"
    cmds:
      - docker build --progress plain
          -t {{.REGISTRY}}/ds-agent-business-gateway:{{.VERSION}}
          --build-arg APP_NAME=rainbow_business_gateway
          -f {{.DOCKERFILE}} .

  build:all:
    desc: "Build all images"
    cmds:
      - task: build:core
      - task: build:catalog
      - task: build:contracts
      - task: build:transfer
      - task: build:transfer-agent
      - task: build:auth
      - task: build:fe-gateway
      - task: build:business-gateway

  # ─── push ───────────────────────────────────────────────────────────────────
  push:core:
    desc: "Push ds-agent-core image"
    cmds:
      - docker push {{.REGISTRY}}/rainbow:{{.VERSION}}

  push:catalog:
    desc: "Push ds-agent-catalog image"
    cmds:
      - docker push {{.REGISTRY}}/ds-agent-catalog:{{.VERSION}}

  push:contracts:
    desc: "Push ds-agent-contracts image"
    cmds:
      - docker push {{.REGISTRY}}/ds-agent-contracts:{{.VERSION}}

  push:transfer:
    desc: "Push ds-agent-transfer image"
    cmds:
      - docker push {{.REGISTRY}}/ds-agent-transfer:{{.VERSION}}

  push:transfer-agent:
    desc: "Push ds-agent-transfer-agent image"
    cmds:
      - docker push {{.REGISTRY}}/ds-agent-transfer-agent:{{.VERSION}}

  push:auth:
    desc: "Push ds-agent-auth image"
    cmds:
      - docker push {{.REGISTRY}}/ds-agent-auth:{{.VERSION}}

  push:fe-gateway:
    desc: "Push ds-agent-fe-gateway image"
    cmds:
      - docker push {{.REGISTRY}}/ds-agent-fe-gateway:{{.VERSION}}

  push:business-gateway:
    desc: "Push ds-agent-business-gateway image"
    cmds:
      - docker push {{.REGISTRY}}/ds-agent-business-gateway:{{.VERSION}}

  push:all:
    desc: "Push all images"
    cmds:
      - task: push:core
      - task: push:catalog
      - task: push:contracts
      - task: push:transfer
      - task: push:transfer-agent
      - task: push:auth
      - task: push:fe-gateway
      - task: push:business-gateway
