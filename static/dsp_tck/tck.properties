dataspacetck.debug=true
dataspacetck.dsp.local.connector=false

# TCK server (the embedded DSP connector the TCK spins up)
dataspacetck.host=0.0.0.0
dataspacetck.port=8080
dataspacetck.callback.address=http://host.docker.internal:8080

# ── Connector Under Test (CUT) ────────────────────────────────────────────────
# Provider (CUT) DSP base and protocol path
dataspacetck.dsp.connector.agent.id=PROVIDER_AGENT_ID
dataspacetck.dsp.connector.http.url=http://host.docker.internal:1200/dsp/current
dataspacetck.dsp.connector.http.base.url=http://host.docker.internal:1200

# Bearer token obtained after onboarding — injected by run-tck.sh
dataspacetck.dsp.connector.http.headers.authorization=Bearer PROVIDER_ACCESS_TOKEN

# Wait time (ms) for async state transitions
dataspacetck.dsp.default.wait=15000

# Consumer initiate endpoints (for CN_C / TP_C tests)
dataspacetck.dsp.connector.negotiation.initiate.url=http://host.docker.internal:1100/tck/negotiations/requests
dataspacetck.dsp.connector.transfer.initiate.url=http://host.docker.internal:1100/tck/transfers/requests

