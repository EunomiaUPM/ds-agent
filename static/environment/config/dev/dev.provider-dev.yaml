# ==========================
# COMMON ANCHORS
# ==========================
http_host: &http_host
  protocol: 'http'
  url: '127.0.0.1'
  port: '1200'
  internal_port: null

min_http_host: &min_http_host
  protocol: 'http'
  url: '127.0.0.1'
  port: '1200'
  internal_port: null

hosts_default: &hosts_default
  http: *http_host
  grpc: null
  graphql: null

min_hosts_default: &min_hosts_default
  http: *min_http_host
  grpc: null
  graphql: null

api_version: &api_version 'v1'

min_known_config: &min_known_config
  hosts: *min_hosts_default
  api_version: *api_version

is_catalog_datahub: &is_catalog_datahub false

policy_templates_folder: &policy_templates_folder './../../static/policy_templates'

cache_config: &cache_config
  cache_type: Redis
  url: '127.0.0.1'
  port: '6379'
  user: 'default'
  password: 'ds_core_provider_redis'

common_config: &common_config
  hosts: *hosts_default
  db:
    db_type: Postgres
    url: '127.0.0.1'
    port: '1400'
  api:
    version: *api_version
    openapi_path: './../../static/specs/openapi/merged_openapi.json'
  connection:
    is_local: true
    is_prod: false
    is_vault_real: false
    has_tls_proxy: false

# ==========================
# MONOLITH
# ==========================
monolith:
  common: *common_config
  cache: *cache_config

# ==========================
# CATALOG
# ==========================
catalog:
  common: *common_config
  cache: *cache_config
  is_datahub: *is_catalog_datahub
  policy_templates_folder: *policy_templates_folder
  datahub_host: null
  datahub_token: null
  ssi_auth: *min_known_config
  contracts: *min_known_config

# ==========================
# SSI AUTH
# ==========================
ssi_auth:
  common_config: *common_config
  wallet_config:
    wallet: Fafnir
    api:
      http:
        protocol: 'http'
        url: '127.0.0.1'
        port: '7002'
      grpc: null
      graphql: null
  client_config:
    class_id: 'Provider'
    display: null
  verify_req_config:
    is_cert_allowed: false
    auto_approve_cert: false
    vcs_requested: [DataSpaceParticipant]
  gaia_config: null

  did_config:
    type: Jwk
#  did_config:
#    type: Web
#    domain: '127.0.0.1'
#    path:
#    port: '1200'

# ==========================
# CONTRACTS
# ==========================
contracts:
  common: *common_config
  ssi_auth: *min_known_config
  is_catalog_datahub: *is_catalog_datahub

# ==========================
# TRANSFER
# ==========================
transfer:
  common: *common_config
  cache: *cache_config
  contracts: *min_known_config
  catalog: *min_known_config
  ssi_auth: *min_known_config
  is_catalog_datahub: *is_catalog_datahub

# ==========================
# GATEWAY
# ==========================
gateway:
  common: *common_config
  is_production: false
  transfer: *min_known_config
  contracts: *min_known_config
  catalog: *min_known_config
  ssi_auth: *min_known_config
  is_catalog_datahub: *is_catalog_datahub
