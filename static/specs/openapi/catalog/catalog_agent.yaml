openapi: 3.1.0
info:
  title: Eunomia DS Catalog Agent API
  description: |
    Management API of the catalog agent (`crates/catalog-agent`): catalogs, datasets,
    distributions, data services, ODRL offers, policy templates, one-step dataset offerings,
    cached peer catalogs and tenant provisioning. Entity responses use camelCase keys.
  version: 1.0.0
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: http://127.0.0.1:1200
  description: Provider agent (dev)
- url: http://127.0.0.1:1100
  description: Consumer agent (dev)
security:
- bearerAuth: []
tags:
- name: Catalogs
  description: DCAT catalogs; each tenant has one main catalog
- name: Datasets
  description: Datasets of a catalog
- name: Distributions
  description: Distributions of a dataset
- name: Data Services
  description: Data services of a catalog; each tenant has one main data service
- name: ODRL Policies
  description: ODRL offers attached to catalog entities
- name: Policy Templates
  description: Versioned ODRL templates with `$parameter` placeholders
- name: Dataset Offerings
  description: Dataset, distribution and policy published in one call
- name: Peer Catalogs
  description: Catalogs of peers, cached from DSP catalog requests
- name: Tenants
  description: Tenant provisioning
paths:
  /api/v1/catalog-agent/catalogs:
    get:
      tags:
      - Catalogs
      operationId: getAllCatalogs
      summary: List catalogs
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/TenantIdQuery'
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: creator
        in: query
        required: false
        schema:
          type: string
      - name: participant_id
        in: query
        required: false
        schema:
          type: string
      - name: with_main_catalog
        in: query
        required: false
        description: Include the tenant's main catalog in the listing.
        schema:
          type: boolean
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of catalogs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Catalogs
      operationId: createCatalog
      summary: Create a catalog
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCatalogDto'
      responses:
        '201':
          description: Created catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog-agent/catalogs/main:
    get:
      tags:
      - Catalogs
      operationId: getMainCatalog
      summary: The tenant's main catalog
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Main catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Catalogs
      operationId: createMainCatalog
      summary: Create the tenant's main catalog
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCatalogDto'
      responses:
        '201':
          description: Created main catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog-agent/catalogs/batch:
    post:
      tags:
      - Catalogs
      operationId: getBatchCatalogs
      summary: Get several catalogs by id
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequests'
      responses:
        '200':
          description: Catalogs found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog-agent/catalogs/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    - $ref: '#/components/parameters/TenantHeader'
    get:
      tags:
      - Catalogs
      operationId: getCatalogById
      summary: Get a catalog
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Catalogs
      operationId: updateCatalogById
      summary: Update a catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCatalogDto'
      responses:
        '202':
          description: Updated catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Catalogs
      operationId: deleteCatalogById
      summary: Delete a catalog
      responses:
        '202':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
