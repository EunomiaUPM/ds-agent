  /api/v1/catalog-agent/schemas/infer:
    post:
      tags:
      - Schemas
      operationId: inferSchema
      summary: Infer a JSON Schema from sample documents
      description: Fields present in every sample are required; integer and decimal values make a number;
        clear string formats (date-time, date, email, uri, uuid) are kept. Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferSchemaDto'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonSchemaDocument'
          description: The inferred schema
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
