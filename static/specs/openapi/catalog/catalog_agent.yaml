        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/dataset-offerings:
    post:
      tags:
      - Dataset Offerings
      operationId: createDatasetOffering
      summary: Publish a dataset, its distribution and a policy in one call
      description: Without `inCatalog` the dataset goes to the main catalog; without `accessService`,
        `accessURL` or `downloadURL` the main data service serves the distribution. A failure after the
        dataset removes it again.
      parameters:
      - $ref: '#/components/parameters/VisibilityHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDatasetOfferingDto'
      responses:
        '201':
          description: What was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetOfferingDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/catalog-agent/public/dcat3/catalog:
    get:
      tags:
      - Public Profiles
      operationId: publicDcat3Catalog
      summary: Main catalog in DCAT 3 (W3C), nearly everything optional
      security: []
      description: 'Public: only what is not private. `If-None-Match` answers 304.'
      responses:
        '200':
          description: The main catalog and what it holds, as one @graph
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/ProfileDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Link:
              $ref: '#/components/headers/Link'
        '304':
          description: Not modified
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/public/dcat3/resources/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    get:
      tags:
      - Public Profiles
      operationId: publicDcat3Resource
      summary: One resource in DCAT 3 (W3C), nearly everything optional
      security: []
      responses:
        '200':
          description: The resource and its closure
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/ProfileDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Link:
              $ref: '#/components/headers/Link'
        '304':
          description: Not modified
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/public/dcat3/context.jsonld:
    get:
      tags:
      - Public Profiles
      operationId: publicDcat3Context
      summary: The profile's JSON-LD context
      security: []
      responses:
        '200':
          description: Context document
          content:
            application/ld+json:
              schema:
                type: object
  /api/v1/catalog-agent/public/dcat-ap/catalog:
    get:
      tags:
      - Public Profiles
      operationId: publicDcatApCatalog
      summary: Main catalog in DCAT-AP 3.0.1, with mandatory properties and EU controlled vocabularies
      security: []
      description: 'Public: only what is not private. `If-None-Match` answers 304.'
      responses:
        '200':
          description: The main catalog and what it holds, as one @graph
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/ProfileDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Link:
              $ref: '#/components/headers/Link'
        '304':
          description: Not modified
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/public/dcat-ap/resources/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    get:
      tags:
      - Public Profiles
      operationId: publicDcatApResource
      summary: One resource in DCAT-AP 3.0.1, with mandatory properties and EU controlled vocabularies
      security: []
      responses:
        '200':
          description: The resource and its closure
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/ProfileDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Link:
              $ref: '#/components/headers/Link'
        '304':
          description: Not modified
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/public/dcat-ap/context.jsonld:
    get:
      tags:
      - Public Profiles
      operationId: publicDcatApContext
      summary: The profile's JSON-LD context
      security: []
      responses:
        '200':
          description: Context document
          content:
            application/ld+json:
              schema:
                type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth access token (JWT) or personal access token issued by `/oauth`.
  parameters:
    CreatedAfter:
      name: created_after
      in: query
      required: false
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `nextCursor` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, clamped to 1..=100.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    PageNumber:
      name: page
      in: query
      required: false
      description: 1-based page index for offset paging, used when no cursor is sent.
      schema:
        type: integer
        minimum: 1
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
        - created_at_asc
        - created_at_desc
        - updated_at_asc
        - updated_at_desc
        default: created_at_desc
    StringPathId:
      name: id
      in: path
      required: true
      schema:
        type: string
    UrnPathId:
      name: id
      in: path
      required: true
      description: URN of the resource.
      schema:
        type: string
        examples:
        - urn:uuid:5b0f6a1e-2c3d-4e5f-8a9b-0c1d2e3f4a5b
    UserIdQuery:
      name: user_id
      in: query
      required: false
      description: Only the records of this user, among those the caller sees.
      schema:
        type: string
    VisibilityHeader:
      name: Eunomia-Visibility
      in: header
      required: false
      description: Who else sees the resource; private when absent.
      schema:
        $ref: '#/components/schemas/Visibility'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The `ETag` read (`W/"3"`); another stored version is a 412.
      schema:
        type: string
    ProfileQuery:
      name: profile
      in: query
      required: false
      description: 'One profile only: `dsp`, `dcat3` or `dcat-ap`.'
      schema:
        type: string
    DeepQuery:
      name: deep
      in: query
      required: false
      description: Diagnose the whole closure, not the resource alone.
      schema:
        type: boolean
        default: false
    ProfilePath:
      name: profile
      in: path
      required: true
      description: '`dsp`, `dcat3` or `dcat-ap`.'
      schema:
        type: string
        enum:
        - dsp
        - dcat3
        - dcat-ap
    DatasetLimitQuery:
      name: limit
      in: query
      required: false
      description: Datasets and series kept in a preview; all when absent.
      schema:
        type: integer
        minimum: 0
    RdfFormatQuery:
      name: format
      in: query
      required: false
      description: Syntax of the answer; without it the `Accept` header decides, JSON-LD by default.
      schema:
        type: string
        enum:
        - jsonld
        - turtle
        - ntriples
        - rdfxml
    DownloadQuery:
      name: download
      in: query
      required: false
      description: The whole document as an attachment; `limit` is ignored.
      schema:
        type: boolean
        default: false
    ImportProfileQuery:
      name: profile
      in: query
      required: false
      description: The profile whose shapes validate the document.
      schema:
        type: string
        enum:
        - dcat-ap
        - dcat3
        default: dcat-ap
    ImportModeQuery:
      name: mode
      in: query
      required: false
      description: '`upsert` replaces stored resources one version on; `create` refuses the document if any is stored.'
      schema:
        type: string
        enum:
        - upsert
        - create
        default: upsert
    DryRunQuery:
      name: dryRun
      in: query
      required: false
      description: Validate and plan without writing.
      schema:
        type: boolean
        default: false
    ImportTargetQuery:
      name: target
      in: query
      required: false
      description: A catalog (URN) the document's resources go into; its own catalogs are then not stored.
      schema:
        type: string
    ShaclChecksQuery:
      name: checks
      in: query
      required: false
      description: 'Shape groups, comma separated. DCAT-AP: `base`, `recommended`, `deprecated` (the default), `range` and `codelists` (need background knowledge). DCAT 3: `base`.'
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Forbidden:
      description: The caller may not act on this tenant or resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Conflict:
      description: The resource already exists or changed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    PreconditionFailed:
      description: The resource changed since the version `If-Match` names
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
  headers:
    ETag:
      description: Weak tag of the stored version (`W/"3"`); on public routes, a strong tag of the body.
      schema:
        type: string
    Eunomia-Visibility:
      description: Private, Anonymous or Public.
      schema:
        $ref: '#/components/schemas/Visibility'
    Eunomia-Owner:
      description: User id of the owner.
      schema:
        type: string
    Eunomia-Owner-Role:
      description: Role path of the owner.
      schema:
        type: string
    X-Total-Count:
      description: Resources matching the filter.
      schema:
        type: integer
    X-Next-Cursor:
      description: Cursor of the next page, when there is one.
      schema:
        type: string
    Link:
      description: '`rel="next"` with the next cursor, or `rel="profile"` on public routes.'
      schema:
        type: string
    X-Shown-Count:
      description: Datasets and series a preview shows.
      schema:
        type: integer
    Content-Disposition:
      description: '`attachment; filename="…"` on a download.'
      schema:
        type: string
