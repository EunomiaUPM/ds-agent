      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/TenantIdQuery'
      - name: entity
        in: query
        required: false
        description: URN of the entity.
        schema:
          type: string
      - name: entity_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CatalogEntityType'
      - name: source_template_id
        in: query
        required: false
        schema:
          type: string
      - name: source_template_version
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOdrlPolicyDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - ODRL Policies
      operationId: createOdrlPolicy
      summary: Attach an ODRL offer to an entity
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOdrlPolicyDto'
      responses:
        '200':
          description: Created offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OdrlPolicyDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog-agent/odrl-policies/batch:
    post:
      tags:
      - ODRL Policies
      operationId: getBatchOdrlPolicies
      summary: Get several offers by id
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequests'
      responses:
        '200':
          description: Offers found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OdrlPolicyDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog-agent/odrl-policies/entity/{entityId}:
    parameters:
    - name: entityId
      in: path
      required: true
      description: URN of the catalog entity.
      schema:
        type: string
    - $ref: '#/components/parameters/TenantHeader'
    get:
      tags:
      - ODRL Policies
      operationId: getOdrlPoliciesByEntity
      summary: Offers attached to an entity
      responses:
        '200':
          description: Offers of the entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OdrlPolicyDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - ODRL Policies
      operationId: deleteOdrlPoliciesByEntity
      summary: Delete every offer of an entity
      responses:
        '202':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog-agent/odrl-policies/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    - $ref: '#/components/parameters/TenantHeader'
    get:
      tags:
      - ODRL Policies
      operationId: getOdrlPolicyById
      summary: Get an offer
      responses:
        '200':
          description: Offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OdrlPolicyDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - ODRL Policies
      operationId: deleteOdrlPolicyById
      summary: Delete an offer
      responses:
        '202':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/policy-templates:
    get:
      tags:
      - Policy Templates
      operationId: getAllPolicyTemplates
      summary: List policy templates
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/TenantIdQuery'
      - name: id
        in: query
        required: false
        schema:
          type: string
      - name: version
        in: query
        required: false
        schema:
          type: string
      - name: author
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPolicyTemplateDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Policy Templates
      operationId: createPolicyTemplate
      summary: Create a policy template or a new version of one
      description: |
        With `silent=true` an invalid body or an existing id and version answers 200 with an empty
        body instead of an error; seeders use it to stay idempotent.
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: silent
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPolicyTemplateDto'
      responses:
        '200':
          description: Created template (empty when skipped in silent mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyTemplateDto'
        '400':
          description: Invalid JSON (plain text) or validation error
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog-agent/policy-templates/batch:
    post:
      tags:
      - Policy Templates
      operationId: getBatchPolicyTemplates
      summary: Get several templates by id
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequestsAsString'
      responses:
        '200':
          description: Templates found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyTemplateDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog-agent/policy-templates/instantiate-odrl-offer:
    post:
      tags:
      - Policy Templates
      operationId: instantiateOdrlOffer
      summary: Instantiate a template as an offer on an entity
      description: Validates the parameters, fills the placeholders and stores the resulting offer.
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPolicyInstantiationDto'
      responses:
        '202':
          description: Created offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OdrlPolicyDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/policy-templates/{id}:
    get:
      tags:
      - Policy Templates
      operationId: getPolicyTemplateById
      summary: Every version of a template
      parameters:
      - $ref: '#/components/parameters/StringPathId'
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Versions of the template
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyTemplateDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog-agent/policy-templates/{id}/{version}:
    parameters:
    - $ref: '#/components/parameters/StringPathId'
    - name: version
      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/TenantHeader'
    get:
      tags:
      - Policy Templates
      operationId: getPolicyTemplateByIdAndVersion
      summary: Get one template version
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyTemplateDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Policy Templates
      operationId: deletePolicyTemplateByIdAndVersion
      summary: Delete one template version
      responses:
        '202':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/dataset-offerings:
    post:
      tags:
      - Dataset Offerings
      operationId: createDatasetOffering
      summary: Publish a dataset with its distribution and policy
      description: |
        Without `dataset.catalogId` the dataset goes to the tenant's main catalog; without
        `distribution.accessServiceId` the distribution uses the main data service.
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDatasetOfferingDto'
      responses:
        '201':
          description: Created entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetOfferingDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/peer-catalogs:
    get:
      tags:
      - Peer Catalogs
      operationId: getAllPeerCatalog
      summary: Cached catalogs of every peer
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: One `[participant, catalog]` pair per peer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeerCatalogEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog-agent/peer-catalogs/{peerId}:
    get:
      tags:
      - Peer Catalogs
      operationId: getPeerCatalog
      summary: Cached catalog of one peer
      parameters:
      - name: peerId
        in: path
        required: true
        description: Participant id (DID) of the peer.
        schema:
          type: string
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Peer catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DspCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/tenants/{tenantId}/provision:
    post:
      tags:
      - Tenants
      operationId: provisionTenant
      summary: Give a tenant its main catalog and data service
      description: Idempotent; existing main entities are kept.
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The tenant's main entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedTenantDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth access token (JWT) or personal access token issued by `/oauth`.
  parameters:
    CreatedAfter:
      name: created_after
      in: query
      required: false
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `nextCursor` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, clamped to 1..=100.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    PageNumber:
      name: page
      in: query
      required: false
      description: 1-based page index for offset paging, used when no cursor is sent.
      schema:
        type: integer
        minimum: 1
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
        - created_at_asc
        - created_at_desc
        - updated_at_asc
        - updated_at_desc
        default: created_at_desc
    StringPathId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TenantHeader:
      name: x-tenant-id
      in: header
      required: false
      description: Tenant to act on. Non-admins may only name their own tenant.
      schema:
        type: string
    TenantIdQuery:
      name: tenant_id
      in: query
      required: false
      description: Tenant filter, honoured for admins.
      schema:
        type: string
    UrnPathId:
      name: id
      in: path
      required: true
      description: URN of the resource.
      schema:
        type: string
        examples:
        - urn:uuid:5b0f6a1e-2c3d-4e5f-8a9b-0c1d2e3f4a5b
  responses:
    BadRequest:
      description: Malformed request or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Forbidden:
      description: The caller may not act on this tenant or resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
  schemas:
    BatchRequests:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          description: URNs to look up.
          items:
            type: string
    BatchRequestsAsString:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: string
    CatalogDto:
      type: object
      required:
      - id
      - tenantId
      - dctIssued
      - dspaceMainCatalog
      properties:
        id:
          type: string
          description: URN of the catalog.
        tenantId:
          type: string
        foafHomePage:
          type:
          - string
          - 'null'
        dctConformsTo:
          type:
          - string
          - 'null'
        dctCreator:
          type:
          - string
          - 'null'
        dctIdentifier:
          type:
          - string
          - 'null'
        dctIssued:
          type: string
          format: date-time
        dctModified:
          type:
          - string
          - 'null'
          format: date-time
        dctTitle:
          type:
          - string
          - 'null'
        dspaceParticipantId:
          type:
          - string
          - 'null'
        dspaceMainCatalog:
          type: boolean
    CatalogEntityType:
      type: string
      enum:
      - Catalog
      - Dataset
      - Distribution
      - DataService
    ContextField:
      description: JSON-LD context; must include the DSP 2024-1 or 2025-1 context.
      oneOf:
      - type: string
      - type: array
        items:
          type: string
      examples:
      - https://w3id.org/dspace/2025/1/context.jsonld
    DataServiceDto:
      type: object
      required:
      - id
      - tenantId
      - dcatEndpointUrl
      - dctIssued
      - catalogId
      - dspaceMainDataService
      properties:
        id:
          type: string
          description: URN of the data service.
        tenantId:
          type: string
        dcatEndpointDescription:
          type:
          - string
          - 'null'
        dcatEndpointUrl:
          type: string
        dctConformsTo:
          type:
          - string
          - 'null'
        dctCreator:
          type:
          - string
          - 'null'
        dctIdentifier:
          type:
          - string
          - 'null'
        dctIssued:
          type: string
          format: date-time
        dctModified:
          type:
          - string
          - 'null'
          format: date-time
        dctTitle:
          type:
          - string
          - 'null'
        dctDescription:
          type:
          - string
          - 'null'
        catalogId:
          type: string
        dspaceMainDataService:
          type: boolean
    DatasetDto:
      type: object
      required:
      - id
      - tenantId
      - dctIssued
      - catalogId
      properties:
        id:
          type: string
          description: URN of the dataset.
        tenantId:
          type: string
        dctConformsTo:
          type:
          - string
          - 'null'
        dctCreator:
          type:
          - string
          - 'null'
        dctIdentifier:
          type:
          - string
          - 'null'
        dctIssued:
          type: string
          format: date-time
        dctModified:
          type:
          - string
          - 'null'
          format: date-time
        dctTitle:
          type:
          - string
          - 'null'
        dctDescription:
          type:
          - string
          - 'null'
        catalogId:
          type: string
    DatasetOfferingDto:
      type: object
      required:
      - dataset
      - distribution
      properties:
        dataset:
          $ref: '#/components/schemas/DatasetDto'
        distribution:
          $ref: '#/components/schemas/DistributionDto'
        policy:
          oneOf:
          - $ref: '#/components/schemas/OdrlPolicyDto'
          - type: 'null'
    DistributionDto:
      type: object
      required:
      - id
      - tenantId
      - dctIssued
      - dcatAccessService
      - datasetId
      properties:
        id:
          type: string
          description: URN of the distribution.
        tenantId:
          type: string
        dctIssued:
          type: string
          format: date-time
        dctModified:
          type:
          - string
          - 'null'
          format: date-time
        dctTitle:
          type:
          - string
          - 'null'
        dctDescription:
          type:
          - string
          - 'null'
        dcatAccessService:
          type: string
          description: URN of the data service serving it.
        datasetId:
          type: string
        dctFormat:
          type:
          - string
          - 'null'
          examples:
          - HttpData-PULL
    DspCatalog:
      type: object
      description: DCAT catalog as sent over DSP.
      required:
      - '@context'
      - '@type'
      - '@id'
      - identifier
      - issued
      - catalog
      - dataset
      - service
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          examples:
          - Catalog
        '@id':
          type: string
        homepage:
          type: string
        theme:
          type: string
        keyword:
          type: string
        conformsTo:
          type: string
        creator:
          type: string
        identifier:
          type: string
        issued:
          type: string
          description: Naive timestamp, no zone.
        modified:
          type: string
        title:
          type: string
        description:
          type: array
          items:
            type: string
        participantId:
          type: string
        hasPolicy:
          type: array
          items:
            $ref: '#/components/schemas/OdrlOffer'
        extraFields: {}
        catalog:
          type: array
          description: Nested catalogs, full or minimized.
          items:
            type: object
        dataset:
          type: array
          items:
            $ref: '#/components/schemas/DspDataset'
        service:
          description: One data service, a minimized one, or a list.
          oneOf:
          - $ref: '#/components/schemas/DspDataService'
          - type: array
            items:
              $ref: '#/components/schemas/DspDataService'
    DspDataService:
      type: object
      description: Full data service, or a minimized one with only `@type`, `@id` and DCAT fields.
      required:
      - '@type'
      - '@id'
      - endpointURL
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          examples:
          - DataService
        '@id':
          type: string
        theme:
          type: string
        keyword:
          type: string
        endpointDescription:
          type: string
        endpointURL:
          type: string
        conformsTo:
          type: string
        creator:
          type: string
        identifier:
          type: string
        issued:
          type: string
        modified:
          type: string
        title:
          type: string
        description:
          type: array
          items:
            type: string
        hasPolicy:
          type: array
          items:
            $ref: '#/components/schemas/OdrlOffer'
        extraFields: {}
    DspDataset:
      type: object
      required:
      - '@type'
      - '@id'
      - identifier
      - issued
      - hasPolicy
      - distribution
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          examples:
          - Dataset
        '@id':
          type: string
        theme:
          type: string
        keyword:
          type: string
        conformsTo:
          type: string
        creator:
          type: string
        identifier:
          type: string
        issued:
          type: string
          description: Naive timestamp, no zone.
        modified:
          type: string
        title:
          type: string
        description:
          type: array
          items:
            type: string
        hasPolicy:
          type: array
          items:
            $ref: '#/components/schemas/OdrlOffer'
        extraFields: {}
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/DspDistribution'
    DspDistribution:
      type: object
      required:
      - '@type'
      - '@id'
      - issued
      - formats
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          examples:
          - Distribution
        '@id':
          type: string
        accessService:
          oneOf:
          - $ref: '#/components/schemas/DspDataService'
          - type: array
            items:
              $ref: '#/components/schemas/DspDataService'
          - type: 'null'
        issued:
          type: string
          description: Naive timestamp, no zone.
        modified:
          type: string
        title:
          type: string
        description:
          type: array
          items:
