      - Schemas
      operationId: getSchemaVersions
      summary: Every version of a schema, newest first
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaView'
          description: Versions
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Schemas
      operationId: deleteSchema
      summary: Delete a schema and all its versions
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog-agent/schemas/{id}/versions:
