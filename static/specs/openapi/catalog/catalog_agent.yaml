      in: path
      required: true
      description: Version number, `3` or `v3`.
      schema:
        type: string
    get:
      tags:
      - Schemas
      operationId: getSchemaVersion
      summary: One version, its content and the resources using it
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVersionView'
          description: Version
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Schemas
      operationId: deleteSchemaVersion
      summary: Delete one version
      description: A version a resource uses as its `schema` is a 409.
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog-agent/public/schemas/{id}/{version}:
    parameters:
    - $ref: '#/components/parameters/StringPathId'
    - name: version
      in: path
      required: true
      description: Version number, `3` or `v3`.
      schema:
        type: string
    get:
      tags:
      - Public Profiles
      operationId: getPublishedSchema
      summary: A hosted schema version, as anyone dereferences it
      description: What `conformsTo` points to. Immutable, cacheable, CORS-open; private schemas are not
        served.
      security: []
      responses:
        '200':
          description: The JSON Schema, `$id` set to this URL
          content:
            application/schema+json:
              schema:
                $ref: '#/components/schemas/JsonSchemaDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/peer-catalogs:
    get:
      tags:
      - Peer Catalogs
      operationId: getAllPeerCatalog
      summary: Cached catalogs of every peer
      responses:
        '200':
          description: One `[participant, catalog]` pair per peer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeerCatalogEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog-agent/peer-catalogs/{peerId}:
    get:
      tags:
      - Peer Catalogs
      operationId: getPeerCatalog
      summary: Cached catalog of one peer
      parameters:
      - name: peerId
        in: path
        required: true
        description: Participant id (DID) of the peer.
        schema:
          type: string
      responses:
        '200':
