openapi: 3.1.0
info:
  title: Eunomia DS Catalog Agent API
  version: 2.1.0
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
  description: |
    Management API of the catalog agent (`crates/catalog-agent`). Every DCAT resource (catalog, dataset, dataset series, distribution, data service, agent, catalog record) is JSON-LD in the eunomia catalog context (`https://w3id.org/eunomia/v1/catalog-context.jsonld`); bodies are read through RDF, so any context works. Version, visibility and owner travel in headers (`ETag` / `If-Match`, `Eunomia-Visibility`, `Eunomia-Owner`); lists page through `X-Total-Count` and `X-Next-Cursor`. Each resource has a doctor that says whether it conforms to DSP, DCAT 3 and DCAT-AP, and the public routes serve the catalog in those profiles. ODRL offers and policy templates stay ODRL JSON.
servers:
- url: http://127.0.0.1:1200
  description: Provider agent (dev)
- url: http://127.0.0.1:1100
  description: Consumer agent (dev)
security:
- bearerAuth: []
tags:
- name: Catalogs
  description: DCAT catalogs; the connector has one main catalog
- name: Datasets
  description: Datasets of a catalog
- name: Dataset Series
  description: Dataset series of a catalog
- name: Distributions
  description: Distributions of a dataset
- name: Data Services
  description: Data services of a catalog; the connector has one main data service
- name: Agents
  description: Publishers, creators and rights holders
- name: Catalog Records
  description: Records describing a catalog's entries
- name: Doctor
  description: Conformance of a resource to each registered profile
- name: Catalog Exchange
  description: A catalog in any profile and RDF syntax, and DCAT imports validated with SHACL
- name: Public Profiles
  description: Read-only catalog in each profile, with no authentication
- name: ODRL Policies
  description: ODRL offers attached to catalog resources
- name: Policy Templates
  description: Versioned ODRL templates with `$parameter` placeholders
- name: Dataset Offerings
  description: Dataset, distribution and policy published in one call
- name: Schemas
  description: JSON Schemas hosted for `conformsTo`, versioned and immutable
- name: Peer Catalogs
  description: Catalogs of peers, cached from DSP catalog requests
paths:
  /api/v1/catalog-agent/catalogs:
    get:
      tags:
      - Catalogs
      operationId: getAllCatalogs
      summary: List Catalogs
      description: One page as a JSON-LD `@graph`; the total and the next cursor come in headers.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/UserIdQuery'
      - name: catalog_id
        in: query
        required: false
        description: Only resources of this catalog.
        schema:
          type: string
      - name: dataset_id
        in: query
        required: false
        description: Only distributions of this dataset.
        schema:
          type: string
      - name: title
        in: query
        required: false
        description: Part of the title, in any language.
        schema:
          type: string
      - name: keyword
        in: query
        required: false
        description: A `dcat:keyword`, exactly.
        schema:
          type: string
      - name: theme
        in: query
        required: false
        description: A `dcat:theme` IRI.
        schema:
          type: string
      - name: format
        in: query
        required: false
        description: A `dct:format`, literal (`http+pull`) or IRI.
        schema:
          type: string
      - name: creator
        in: query
        required: false
        description: A `dct:creator` IRI.
        schema:
          type: string
      - name: publisher
        in: query
        required: false
        description: A `dct:publisher` IRI.
        schema:
          type: string
      - name: conforms_to
        in: query
        required: false
        description: A `dct:conformsTo` IRI.
        schema:
          type: string
      - name: participant_id
        in: query
        required: false
        description: A `dspace:participantId`.
        schema:
          type: string
      - name: access_service
        in: query
        required: false
        description: A `dcat:accessService`.
        schema:
          type: string
      - name: endpoint_url
        in: query
        required: false
        description: A `dcat:endpointURL`.
        schema:
          type: string
      - name: main
        in: query
        required: false
        description: '`false` leaves out the connector''s main resource; `true` keeps only it.'
        schema:
          type: boolean
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of Catalogs
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/CatalogGraph'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            X-Next-Cursor:
              $ref: '#/components/headers/X-Next-Cursor'
            Link:
              $ref: '#/components/headers/Link'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Catalogs
      operationId: createCatalog
      summary: Create a Catalog
      description: A `Catalog` document in the catalog context (a body with no `@type` is taken as one).
      parameters:
      - $ref: '#/components/parameters/VisibilityHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogDocument'
      responses:
        '201':
          description: Created Catalog
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/CatalogDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Eunomia-Visibility:
              $ref: '#/components/headers/Eunomia-Visibility'
            Eunomia-Owner:
              $ref: '#/components/headers/Eunomia-Owner'
            Eunomia-Owner-Role:
              $ref: '#/components/headers/Eunomia-Owner-Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/catalog-agent/catalogs/batch:
    post:
      tags:
      - Catalogs
      operationId: getBatchCatalogs
      summary: Catalogs by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequests'
      responses:
        '200':
          description: The Catalogs found
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/CatalogGraph'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog-agent/catalogs/main:
    get:
      tags:
      - Catalogs
      operationId: getMainCatalog
      summary: The connector's main Catalog
      responses:
        '200':
          description: Main Catalog
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/CatalogDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Eunomia-Visibility:
              $ref: '#/components/headers/Eunomia-Visibility'
            Eunomia-Owner:
              $ref: '#/components/headers/Eunomia-Owner'
            Eunomia-Owner-Role:
              $ref: '#/components/headers/Eunomia-Owner-Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Catalogs
      operationId: createMainCatalog
      summary: Create the main Catalog (root only)
      description: 'Idempotent: an existing main one is returned. `{}` is a valid body.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogDocument'
      responses:
        '201':
          description: Main Catalog
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/CatalogDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Eunomia-Visibility:
              $ref: '#/components/headers/Eunomia-Visibility'
            Eunomia-Owner:
              $ref: '#/components/headers/Eunomia-Owner'
            Eunomia-Owner-Role:
              $ref: '#/components/headers/Eunomia-Owner-Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog-agent/catalogs/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    get:
      tags:
      - Catalogs
      operationId: getCatalogById
      summary: One Catalog
      responses:
        '200':
          description: Catalog
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/CatalogDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Eunomia-Visibility:
              $ref: '#/components/headers/Eunomia-Visibility'
            Eunomia-Owner:
              $ref: '#/components/headers/Eunomia-Owner'
            Eunomia-Owner-Role:
              $ref: '#/components/headers/Eunomia-Owner-Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Catalogs
      operationId: updateCatalogById
      summary: Replace a Catalog's description
      description: The body replaces the description whole; the parent cannot change. With `If-Match`,
        a stored version other than the one named is a 412.
      parameters:
      - $ref: '#/components/parameters/VisibilityHeader'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogDocument'
      responses:
        '200':
          description: Updated Catalog
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/CatalogDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Eunomia-Visibility:
              $ref: '#/components/headers/Eunomia-Visibility'
            Eunomia-Owner:
              $ref: '#/components/headers/Eunomia-Owner'
            Eunomia-Owner-Role:
              $ref: '#/components/headers/Eunomia-Owner-Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags:
      - Catalogs
      operationId: deleteCatalogById
      summary: Delete a Catalog
      description: What hangs from it goes with it; a resource others link to is a 409.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /api/v1/catalog-agent/catalogs/{id}/doctor:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    get:
      tags:
      - Doctor
      operationId: doctorCatalog
      summary: Does the Catalog conform to each profile?
      description: Every registered profile (DSP, DCAT 3, DCAT-AP…) diagnoses the resource. Read only.
      parameters:
      - $ref: '#/components/parameters/ProfileQuery'
      - $ref: '#/components/parameters/DeepQuery'
      responses:
        '200':
          description: One diagnosis per profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/catalogs/{id}/profiles/{profile}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    - $ref: '#/components/parameters/ProfilePath'
    get:
      tags:
      - Catalog Exchange
      operationId: getCatalogInProfile
      summary: The Catalog in one profile
      description: The catalog as its owner sees it, projected by the profile (DSP, DCAT 3, DCAT-AP) in JSON-LD or any RDF syntax. `limit` keeps the first datasets and series with what hangs from them, for a preview; `download=true` answers the whole document as an attachment. `X-Total-Count` and `X-Shown-Count` say how many datasets there are and how many it shows.
      parameters:
      - $ref: '#/components/parameters/DatasetLimitQuery'
      - $ref: '#/components/parameters/RdfFormatQuery'
      - $ref: '#/components/parameters/DownloadQuery'
      responses:
        '200':
          description: The projected catalog
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            X-Shown-Count:
              $ref: '#/components/headers/X-Shown-Count'
            Link:
              $ref: '#/components/headers/Link'
            Content-Disposition:
              $ref: '#/components/headers/Content-Disposition'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/ProfileDocument'
            text/turtle:
              schema:
                type: string
            application/n-triples:
              schema:
                type: string
            application/rdf+xml:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog-agent/catalogs/import:
    post:
      tags:
      - Catalog Exchange
      operationId: importCatalog
      summary: Validate a DCAT document with SHACL and load it
      description: The body (JSON-LD, Turtle, RDF/XML or N-Triples, by `Content-Type`) is validated with the profile's SHACL shapes (DCAT-AP 3.0.1 with SEMIC's official ones), planned against the stored catalog and written in one transaction, or not at all. Catalogs, datasets, series, distributions, data services, agents and records become resources; any other node stays inside the resource using it. IRIs that are not URNs get the same URN on every import. `dryRun=true` validates and plans without writing.
      parameters:
      - $ref: '#/components/parameters/ImportProfileQuery'
      - $ref: '#/components/parameters/ImportModeQuery'
      - $ref: '#/components/parameters/DryRunQuery'
      - $ref: '#/components/parameters/ImportTargetQuery'
      - $ref: '#/components/parameters/ShaclChecksQuery'
      - $ref: '#/components/parameters/VisibilityHeader'
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/ProfileDocument'
          text/turtle:
            schema:
              type: string
          application/rdf+xml:
            schema:
              type: string
          application/n-triples:
            schema:
              type: string
      responses:
        '200':
          description: Imported, or validated and planned on a dry run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Not written; the report says what keeps it out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
  /api/v1/catalog-agent/datasets:
    get:
      tags:
      - Datasets
      operationId: getAllDatasets
      summary: List Datasets
      description: One page as a JSON-LD `@graph`; the total and the next cursor come in headers.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/UserIdQuery'
      - name: catalog_id
        in: query
        required: false
        description: Only resources of this catalog.
        schema:
          type: string
      - name: dataset_id
        in: query
        required: false
        description: Only distributions of this dataset.
        schema:
          type: string
      - name: title
        in: query
        required: false
        description: Part of the title, in any language.
        schema:
          type: string
      - name: keyword
        in: query
        required: false
        description: A `dcat:keyword`, exactly.
        schema:
          type: string
      - name: theme
        in: query
        required: false
        description: A `dcat:theme` IRI.
        schema:
          type: string
      - name: format
        in: query
        required: false
        description: A `dct:format`, literal (`http+pull`) or IRI.
        schema:
          type: string
      - name: creator
        in: query
        required: false
        description: A `dct:creator` IRI.
        schema:
          type: string
      - name: publisher
        in: query
        required: false
        description: A `dct:publisher` IRI.
        schema:
          type: string
      - name: conforms_to
        in: query
        required: false
        description: A `dct:conformsTo` IRI.
        schema:
          type: string
      - name: participant_id
        in: query
        required: false
        description: A `dspace:participantId`.
        schema:
          type: string
      - name: access_service
        in: query
        required: false
        description: A `dcat:accessService`.
        schema:
          type: string
      - name: endpoint_url
        in: query
        required: false
        description: A `dcat:endpointURL`.
        schema:
          type: string
      - name: main
        in: query
        required: false
        description: '`false` leaves out the connector''s main resource; `true` keeps only it.'
        schema:
          type: boolean
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of Datasets
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/DatasetGraph'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            X-Next-Cursor:
              $ref: '#/components/headers/X-Next-Cursor'
            Link:
              $ref: '#/components/headers/Link'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Datasets
      operationId: createDataset
      summary: Create a Dataset
      description: A `Dataset` document in the catalog context (a body with no `@type` is taken as one).
        `inCatalog` names its catalog.
      parameters:
      - $ref: '#/components/parameters/VisibilityHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetDocument'
      responses:
        '201':
          description: Created Dataset
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/DatasetDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Eunomia-Visibility:
              $ref: '#/components/headers/Eunomia-Visibility'
            Eunomia-Owner:
              $ref: '#/components/headers/Eunomia-Owner'
            Eunomia-Owner-Role:
              $ref: '#/components/headers/Eunomia-Owner-Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/catalog-agent/datasets/batch:
    post:
      tags:
      - Datasets
      operationId: getBatchDatasets
      summary: Datasets by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequests'
      responses:
        '200':
          description: The Datasets found
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/DatasetGraph'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog-agent/datasets/catalog/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    get:
      tags:
      - Datasets
      operationId: getDatasetsByCatalogId
      summary: Datasets of a catalog
      responses:
        '200':
          description: The catalog's Datasets
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/DatasetGraph'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog-agent/datasets/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    get:
      tags:
      - Datasets
      operationId: getDatasetById
      summary: One Dataset
      responses:
        '200':
          description: Dataset
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/DatasetDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Eunomia-Visibility:
              $ref: '#/components/headers/Eunomia-Visibility'
            Eunomia-Owner:
              $ref: '#/components/headers/Eunomia-Owner'
            Eunomia-Owner-Role:
              $ref: '#/components/headers/Eunomia-Owner-Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Datasets
      operationId: updateDatasetById
      summary: Replace a Dataset's description
      description: The body replaces the description whole; the parent cannot change. With `If-Match`,
        a stored version other than the one named is a 412.
      parameters:
      - $ref: '#/components/parameters/VisibilityHeader'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetDocument'
      responses:
        '200':
          description: Updated Dataset
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/DatasetDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Eunomia-Visibility:
              $ref: '#/components/headers/Eunomia-Visibility'
            Eunomia-Owner:
              $ref: '#/components/headers/Eunomia-Owner'
            Eunomia-Owner-Role:
              $ref: '#/components/headers/Eunomia-Owner-Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags:
      - Datasets
      operationId: deleteDatasetById
      summary: Delete a Dataset
      description: What hangs from it goes with it; a resource others link to is a 409.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /api/v1/catalog-agent/datasets/{id}/doctor:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    get:
      tags:
      - Doctor
      operationId: doctorDataset
      summary: Does the Dataset conform to each profile?
      description: Every registered profile (DSP, DCAT 3, DCAT-AP…) diagnoses the resource. Read only.
      parameters:
      - $ref: '#/components/parameters/ProfileQuery'
      - $ref: '#/components/parameters/DeepQuery'
      responses:
        '200':
          description: One diagnosis per profile
          content:
