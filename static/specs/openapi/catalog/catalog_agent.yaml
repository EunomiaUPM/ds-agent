      tags:
      - Distributions
      operationId: getDistributionByDatasetIdAndFormat
      summary: Distribution of a dataset with a given format
      parameters:
      - $ref: '#/components/parameters/UrnPathId'
      - name: format
        in: path
        required: true
        description: '`dct:format` value.'
        schema:
          type: string
          examples:
          - HttpData-PULL
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
