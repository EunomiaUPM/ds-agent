    - $ref: '#/components/parameters/StringPathId'
    post:
      tags:
      - Schemas
      operationId: createSchemaVersion
      summary: Store the next version of a schema
      description: Earlier versions keep their content and URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSchemaVersionDto'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaView'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog-agent/schemas/{id}/versions/{version}:
    parameters:
    - $ref: '#/components/parameters/StringPathId'
