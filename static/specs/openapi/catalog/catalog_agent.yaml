  /api/v1/catalog-agent/schemas:
    get:
      tags:
      - Schemas
      operationId: getSchemas
      summary: List hosted schema versions
      description: Every version the caller sees, newest first; group them by `id`.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Sort'
      - name: id
        in: query
        required: false
        schema:
          type: string
      - name: title
        in: query
        required: false
        description: Case-insensitive part of the title.
        schema:
          type: string
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSchemaView'
          description: Schema versions
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Schemas
      operationId: createSchema
      summary: Host a new JSON Schema as its version 1
      description: The schema is checked against the 2020-12 meta-schema; its `$id` is replaced by the public
        URL of the version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSchemaDto'
      responses:
        '201':
          content:
            application/json:
              schema:
