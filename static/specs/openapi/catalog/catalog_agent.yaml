      - Policy Templates
      operationId: getAllPolicyTemplates
      summary: List policy templates
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/UserIdQuery'
      - name: id
        in: query
        required: false
        schema:
          type: string
      - name: version
        in: query
        required: false
        schema:
          type: string
      - name: author
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPolicyTemplateDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Policy Templates
      operationId: createPolicyTemplate
      summary: Create a policy template or a new version of one
      description: |
        With `silent=true` an invalid body or an existing id and version answers 200 with an empty
        body instead of an error; seeders use it to stay idempotent.
      parameters:
      - name: silent
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPolicyTemplateDto'
      responses:
        '200':
          description: Created template (empty when skipped in silent mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyTemplateDto'
        '400':
          description: Invalid JSON (plain text) or validation error
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog-agent/policy-templates/batch:
    post:
      tags:
      - Policy Templates
      operationId: getBatchPolicyTemplates
      summary: Get several templates by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequestsAsString'
      responses:
        '200':
          description: Templates found
          content:
