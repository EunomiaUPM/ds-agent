          type: array
          items:
            $ref: '#/components/schemas/OdrlOffer'
        extraFields: {}
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/DspDistribution'
    DspDistribution:
      type: object
      required:
      - '@type'
      - '@id'
      - issued
      - format
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          examples:
          - Distribution
        '@id':
          type: string
        accessService:
          oneOf:
          - $ref: '#/components/schemas/DspDataService'
          - type: array
            items:
              $ref: '#/components/schemas/DspDataService'
          - type: 'null'
        issued:
          type: string
          description: Naive timestamp, no zone.
        modified:
          type: string
        title:
          type: string
        description:
          type: array
          items:
            type: string
        format:
          type: string
          examples:
          - HttpData-PULL
        hasPolicy:
          type: array
          items:
            $ref: '#/components/schemas/OdrlOffer'
        extraFields: {}
    ErrorInfo:
      type: object
      description: Error body returned by every agent.
      required:
      - message
      - error_code
      properties:
        message:
          type: string
        error_code:
          type: integer
          description: Internal error code of the failure kind.
        details:
          type:
          - string
          - 'null'
    Finding:
      type: object
      required:
      - severity
      - resource
      - message
      properties:
        severity:
          $ref: '#/components/schemas/Severity'
        resource:
          type: string
        property:
          type: string
          description: IRI of the property concerned.
        message:
          type: string
    ImportReport:
      type: object
      required:
      - profile
      - dryRun
      - conforms
      - imported
      - validation
      - issues
      - created
      - updated
      - resources
      properties:
        profile:
          type: string
        dryRun:
          type: boolean
        conforms:
          type: boolean
          description: Valid against the shapes and with nothing in the plan keeping it out.
        imported:
          type: boolean
        validation:
          $ref: '#/components/schemas/ShaclReport'
        issues:
          type: array
          description: Problems of the plan against the stored catalog (links, parents, ownership).
          items:
            $ref: '#/components/schemas/Finding'
        created:
          type: integer
        updated:
          type: integer
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ImportedResource'
    ImportedResource:
      type: object
      required:
      - source
      - id
      - type
      - action
      properties:
        source:
          type: string
          description: Its IRI in the document.
        id:
          type: string
        type:
          type: string
        parent:
          type: string
        action:
          type: string
          enum:
          - create
          - update
    LanguageText:
      description: 'A plain string, or a language map (`{"en": "Readings"}`); a language may hold several
        texts.'
      oneOf:
      - type: string
      - type: object
        additionalProperties:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
    LocalizedText:
      description: A plain string, or the same text in several languages.
      oneOf:
      - type: string
      - type: array
        items:
          type: object
          required:
          - '@value'
          - '@language'
          properties:
            '@value':
              type: string
            '@language':
              type: string
    NewDatasetOfferingDto:
      type: object
      additionalProperties: false
      required:
      - dataset
      - distribution
      properties:
        dataset:
          $ref: '#/components/schemas/DatasetDocument'
        distribution:
          $ref: '#/components/schemas/DistributionDocument'
        policy:
          type:
          - object
          - 'null'
          description: A single-permission ODRL offer on the dataset.
          additionalProperties: false
          properties:
            description:
              type:
              - string
              - 'null'
            action:
              type:
              - string
              - 'null'
            profile:
              type:
              - string
              - 'null'
            constraints:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/OdrlConstraint'
    NewOdrlPolicyDto:
      type: object
      additionalProperties: false
      required:
      - odrlOffer
      - entityId
      - entityType
      properties:
        id:
          type:
          - string
          - 'null'
          description: URN; generated when absent.
        visibility:
          description: Who else sees it; private by default.
          $ref: '#/components/schemas/Visibility'
        odrlOffer:
          $ref: '#/components/schemas/OdrlPolicyInfo'
        entityId:
          type: string
          description: URN of the entity.
        entityType:
          $ref: '#/components/schemas/CatalogEntityType'
        sourceTemplateId:
          type: string
        sourceTemplateVersion:
          type: string
        instantiationParameters: {}
        description:
          type: string
    NewPolicyInstantiationDto:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - parameters
      - entityId
      - entityType
      properties:
        id:
          type: string
          description: Template id.
        version:
          type: string
          description: Template version.
        parameters:
          type: object
          description: Values by parameter name.
          additionalProperties:
            $ref: '#/components/schemas/PolicyTemplateAllowedDefaultValues'
        entityId:
          type: string
          description: URN of the entity that receives the offer.
        entityType:
          $ref: '#/components/schemas/CatalogEntityType'
        description:
          type:
          - string
          - 'null'
    NewPolicyTemplateDto:
      type: object
      additionalProperties: false
      required:
      - content
      properties:
        id:
          type: string
        visibility:
          description: Who else sees it; private by default.
          $ref: '#/components/schemas/Visibility'
        version:
          type: string
        date:
          type: string
          format: date-time
        title:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        author:
          type: string
        content:
          $ref: '#/components/schemas/OdrlPolicyInfo'
        parameters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PolicyTemplateParameterDefinition'
    OdrlAtomicConstraint:
      type: object
      required:
      - leftOperand
      - operator
      - rightOperand
      properties:
        leftOperand:
          type: string
        operator:
          $ref: '#/components/schemas/OdrlOperator'
        rightOperand:
          oneOf:
          - type: string
          - type: object
          - type: array
            items: {}
    OdrlConstraint:
      anyOf:
      - $ref: '#/components/schemas/OdrlAtomicConstraint'
      - $ref: '#/components/schemas/OdrlLogicalConstraint'
    OdrlDuty:
      type: object
      required:
      - action
      properties:
        action:
          type: string
        constraint:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/OdrlConstraint'
    OdrlLogicalConstraint:
      type: object
      properties:
        and:
          type: array
          items:
            $ref: '#/components/schemas/OdrlConstraint'
        andSequence:
          type: array
          items:
            $ref: '#/components/schemas/OdrlConstraint'
        or:
          type: array
          items:
            $ref: '#/components/schemas/OdrlConstraint'
        xone:
          type: array
          items:
            $ref: '#/components/schemas/OdrlConstraint'
    OdrlOffer:
      type: object
      required:
      - '@id'
      - '@type'
      properties:
        '@id':
          type: string
        '@type':
          type: string
          enum:
          - Offer
          - Agreement
        profile:
          $ref: '#/components/schemas/OdrlProfile'
        permission:
          type: array
          items:
            $ref: '#/components/schemas/OdrlPermission'
        obligation:
          type: array
          items:
            $ref: '#/components/schemas/OdrlDuty'
        prohibition:
          type: array
          items:
            $ref: '#/components/schemas/OdrlDuty'
        target:
          type: string
        description:
          type: string
    OdrlOperator:
      type: string
      enum:
      - eq
      - gt
      - gteq
      - lteq
      - hasPart
      - isA
      - isAllOf
      - isAnyOf
      - isNoneOf
      - isPartOf
      - lt
      - termLteq
      - neq
    OdrlPermission:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          examples:
          - use
        constraint:
          type: array
          items:
            $ref: '#/components/schemas/OdrlConstraint'
        duty:
          $ref: '#/components/schemas/OdrlDuty'
    OdrlPolicyDto:
      type: object
      required:
      - id
      - userId
      - userRole
      - visibility
      - odrlOffer
      - entity
      - entityType
      - createdAt
      properties:
        id:
          type: string
          description: URN of the offer.
        userId:
          type: string
          description: Author of the record (`system` when a peer opened it).
        userRole:
          type: string
          description: Role the record was created under (or that handles it).
          examples:
          - /admin/upm
        visibility:
          $ref: '#/components/schemas/Visibility'
        odrlOffer:
          $ref: '#/components/schemas/OdrlPolicyInfo'
        entity:
          type: string
          description: URN of the entity the offer is attached to.
        entityType:
          $ref: '#/components/schemas/CatalogEntityType'
        createdAt:
          type: string
          format: date-time
        sourceTemplateId:
          type:
          - string
          - 'null'
        sourceTemplateVersion:
          type:
          - string
          - 'null'
        instantiationParameters:
          description: Parameters used when the offer came from a template.
        description:
          type:
          - string
          - 'null'
    OdrlPolicyInfo:
      type: object
      description: Rules of a policy without its identity or target.
      properties:
        '@context':
          description: '`http://www.w3.org/ns/odrl.jsonld`. Optional on input, where it is assumed; another
            context is refused.'
          oneOf:
          - type: string
            const: http://www.w3.org/ns/odrl.jsonld
          - type: array
            items:
              type: string
            contains:
              const: http://www.w3.org/ns/odrl.jsonld
        '@type':
          type: string
          const: Offer
          description: '`Offer`. Optional on input; another type is refused.'
        profile:
          $ref: '#/components/schemas/OdrlProfile'
        permission:
          type: array
          items:
            $ref: '#/components/schemas/OdrlPermission'
        obligation:
          type: array
          items:
            $ref: '#/components/schemas/OdrlDuty'
        prohibition:
          type: array
          items:
            $ref: '#/components/schemas/OdrlDuty'
        description:
          type: string
    OdrlProfile:
      oneOf:
      - type: string
      - type: array
        items:
          type: string
    PaginatedOdrlPolicyDto:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OdrlPolicyDto'
        nextCursor:
          type: string
          description: Absent on the last page.
        total:
          type: integer
    PaginatedPolicyTemplateDto:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PolicyTemplateDto'
        nextCursor:
          type: string
          description: Absent on the last page.
        total:
          type: integer
    ParticipantDto:
      type: object
      description: Participant registry entry ("mate").
      required:
      - participant_id
      - participant_nick
      - participant_type
      - base_url
      - saved_at
      - last_interaction
      - extra_fields
      properties:
        participant_id:
          type: string
          description: DID of the participant.
        participant_nick:
          type: string
        participant_type:
          $ref: '#/components/schemas/ParticipantType'
        base_url:
          type: string
        saved_at:
          type: string
          format: date-time
        last_interaction:
          type: string
          format: date-time
        extra_fields: {}
    ParticipantType:
      type: string
      enum:
      - Agent
      - Authority
      - All
    JsonSchemaDocument:
      type: object
      description: A JSON Schema (draft 2020-12 unless it names another dialect).
      additionalProperties: true
    SchemaView:
      type: object
      description: A hosted schema version without its content.
      required:
      - id
      - version
      - title
      - visibility
      - createdAt
      - sha256
      - url
      properties:
        id:
          type: string
          description: '`urn:schema:…`, shared by its versions.'
        version:
          type: integer
        title:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        createdAt:
          type: string
          format: date-time
        sha256:
          type: string
        url:
          type: string
          format: uri
          description: Public URL; what a resource's `schema` points to.
    SchemaUsageView:
      type: object
      required:
      - id
      - kind
      properties:
        id:
          type: string
        kind:
          type: string
        title:
          type: string
          nullable: true
    SchemaVersionView:
      allOf:
      - $ref: '#/components/schemas/SchemaView'
      - type: object
        required:
        - schema
        - usedBy
        properties:
          schema:
            $ref: '#/components/schemas/JsonSchemaDocument'
          usedBy:
            type: array
            items:
              $ref: '#/components/schemas/SchemaUsageView'
    PaginatedSchemaView:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SchemaView'
        nextCursor:
          type: string
          description: Absent on the last page.
        total:
          type: integer
    NewSchemaDto:
      type: object
      required:
      - title
      - schema
      additionalProperties: false
      properties:
        title:
          type: string
        description:
          type: string
        schema:
          $ref: '#/components/schemas/JsonSchemaDocument'
        visibility:
          $ref: '#/components/schemas/Visibility'
    NewSchemaVersionDto:
      type: object
      required:
      - schema
      additionalProperties: false
      properties:
        schema:
          $ref: '#/components/schemas/JsonSchemaDocument'
        title:
          type: string
          description: Defaults to the previous version's.
        description:
          type: string
    InferSchemaDto:
      type: object
      required:
      - samples
      additionalProperties: false
      properties:
        samples:
          type: array
          maxItems: 200
          items: {}
          description: Whole documents, one per item.
    ValidateSchemaDto:
      type: object
      required:
      - schema
      additionalProperties: false
      properties:
        schema:
          $ref: '#/components/schemas/JsonSchemaDocument'
        samples:
          type: array
          maxItems: 200
          items: {}
    SchemaIssue:
      type: object
      required:
      - path
      - message
      properties:
        path:
          type: string
          description: JSON pointer into the document.
        message:
          type: string
    SampleReport:
      type: object
      required:
      - index
      - valid
      - issues
      properties:
        index:
          type: integer
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/SchemaIssue'
    SchemaValidationView:
      type: object
      required:
      - valid
      - issues
      - samples
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/SchemaIssue'
        samples:
          type: array
          items:
            $ref: '#/components/schemas/SampleReport'
    CheckSchemaUrlDto:
      type: object
      required:
      - url
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
    SchemaUrlCheckView:
      type: object
      required:
      - url
      - reachable
      - isJsonSchema
      - issues
      properties:
        url:
          type: string
        reachable:
          type: boolean
        isJsonSchema:
          type: boolean
        title:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/SchemaIssue'
    PeerCatalogEntry:
      type: array
      description: A peer and its cached catalog.
      prefixItems:
      - $ref: '#/components/schemas/ParticipantDto'
      - $ref: '#/components/schemas/DspCatalog'
      minItems: 2
      maxItems: 2
    PolicyTemplateAllowedDefaultValues:
      oneOf:
      - type: string
      - type: number
    PolicyTemplateDto:
      type: object
      required:
      - id
      - userId
      - userRole
      - visibility
      - version
      - date
      - author
      - content
      - parameters
      properties:
        id:
          type: string
        userId:
          type: string
          description: Author of the record (`system` when a peer opened it).
        userRole:
          type: string
          description: Role the record was created under (or that handles it).
          examples:
          - /admin/upm
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: string
        date:
          type: string
          format: date-time
        title:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        author:
          type: string
        content:
          $ref: '#/components/schemas/OdrlPolicyInfo'
        parameters:
          type: object
          description: Definitions by placeholder name (`$name` in `content`).
          additionalProperties:
            $ref: '#/components/schemas/PolicyTemplateParameterDefinition'
    PolicyTemplateParameterDefinition:
      type: object
      required:
      - dataType
      properties:
        dataType:
          type: string
          enum:
          - string
          - integer
          - float
          - boolean
          - date
          - time
          - datetime
          - selection
        restrictions:
          type: object
          properties:
            minLength:
              type: integer
            maxLength:
              type: integer
            regex:
              type: string
            minValue:
              type: number
            maxValue:
              type: number
            minDate:
              type: string
            maxDate:
              type: string
            values:
              description: Allowed values of a selection, plain or labelled.
              oneOf:
              - type: array
                items:
                  type: string
              - type: array
                items:
                  type: object
                  required:
                  - value
                  properties:
                    value:
                      type: string
                    label:
                      $ref: '#/components/schemas/LocalizedText'
        ui:
          type: object
          properties:
            label:
              $ref: '#/components/schemas/LocalizedText'
            description:
              $ref: '#/components/schemas/LocalizedText'
            placeholder:
              $ref: '#/components/schemas/LocalizedText'
            hidden:
              type: boolean
              default: false
        defaultValue:
          $ref: '#/components/schemas/PolicyTemplateAllowedDefaultValues'
    ProfileDiagnosis:
      type: object
      required:
      - profile
      - profileIri
      - compliant
      - violations
      - warnings
      - findings
      properties:
        profile:
          type: string
          examples:
          - dcat-ap
        profileIri:
          type: string
        compliant:
          type: boolean
        violations:
          type: integer
        warnings:
          type: integer
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
    ProfileDocument:
      type: object
      description: 'JSON-LD in the profile''s own context: `@context` and `@graph`.'
      properties:
        '@context':
          type: object
        '@graph':
          type: array
          items:
            type: object
    ShaclReport:
      type: object
      required:
      - conforms
      - checks
      - violations
      - warnings
      - results
      properties:
        conforms:
          type: boolean
        checks:
          type: array
          items:
            type: string
        violations:
          type: integer
        warnings:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ShaclResult'
    ShaclResult:
      type: object
      required:
      - check
      - severity
      - focusNode
      - constraint
      - message
      properties:
        check:
          type: string
          description: The shape group that raised it.
        severity:
          $ref: '#/components/schemas/Severity'
        focusNode:
          type: string
        path:
          type: string
        value:
          type: string
        constraint:
          type: string
          examples:
          - MinCount
        sourceShape:
          type: string
        message:
          type: string
    Severity:
      type: string
      enum:
      - violation
      - warning
      - info
      description: A violation breaks conformance; warnings and infos do not.
    Visibility:
      type: string
      description: |
        Who else sees a record beyond those its role lets in: nobody (Private), everyone without
        its author (Anonymous), or everyone (Public).
      enum:
      - Private
      - Anonymous
      - Public
