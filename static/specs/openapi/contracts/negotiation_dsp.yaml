          description: Internal error code of the failure kind.
        details:
          type:
          - string
          - 'null'
    NegotiationMessageRecord:
      type: object
      required:
      - id
      - tenantId
      - negotiationAgentProcessId
      - createdAt
      - direction
      - protocol
      - messageType
      - stateTransitionFrom
      - stateTransitionTo
      - payload
      properties:
        id:
          type: string
        tenantId:
          type: string
        negotiationAgentProcessId:
          type: string
        createdAt:
          type: string
          format: date-time
        direction:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
        protocol:
          type: string
        messageType:
          type: string
          examples:
          - ContractRequestMessage
        stateTransitionFrom:
          type: string
        stateTransitionTo:
          type: string
        payload:
          description: The DSP message as sent or received.
    NegotiationProcessDto:
      description: Negotiation with its identifiers, messages, offers and agreement.
      allOf:
      - $ref: '#/components/schemas/NegotiationProcessRecord'
      - type: object
        required:
        - identifiers
        - messages
        - offers
        properties:
          identifiers:
            type: object
            description: DSP identifiers such as `consumerPid` and `providerPid`.
            additionalProperties:
              type: string
          messages:
            type: array
            items:
              $ref: '#/components/schemas/NegotiationMessageRecord'
          offers:
            type: array
            items:
              $ref: '#/components/schemas/OfferDto'
          agreement:
            oneOf:
            - $ref: '#/components/schemas/AgreementDto'
            - type: 'null'
    NegotiationProcessRecord:
      type: object
      required:
      - id
      - tenantId
      - state
      - associatedAgentPeer
      - protocol
      - role
      - properties
      - createdAt
      properties:
        id:
          type: string
          description: URN of the negotiation.
        tenantId:
          type: string
        state:
          $ref: '#/components/schemas/NegotiationProcessState'
        stateAttribute:
          type:
          - string
          - 'null'
        associatedAgentPeer:
          type: string
          description: Participant id (DID) of the counterpart.
        protocol:
          type: string
          examples:
          - DSP
        callbackAddress:
          type:
          - string
          - 'null'
        role:
          type: string
          enum:
          - Provider
          - Consumer
        properties:
          description: Free-form JSON.
        errorDetails:
          description: Last error, any JSON value.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
    NegotiationProcessState:
      type: string
      enum:
      - REQUESTED
      - OFFERED
      - ACCEPTED
      - AGREED
      - VERIFIED
      - FINALIZED
      - TERMINATED
    OdrlAgreement:
      type: object
      required:
      - '@id'
      - '@type'
      - target
      - assigner
      - assignee
      properties:
        '@id':
          type: string
        '@type':
          type: string
          enum:
          - Offer
          - Agreement
        profile:
          $ref: '#/components/schemas/OdrlProfile'
        permission:
          type: array
          items:
            $ref: '#/components/schemas/OdrlPermission'
        obligation:
          type: array
          items:
            $ref: '#/components/schemas/OdrlDuty'
        prohibition:
          type: array
          items:
            $ref: '#/components/schemas/OdrlDuty'
        target:
          type: string
        assigner:
          type: string
        assignee:
          type: string
        timestamp:
          type:
          - string
          - 'null'
        description:
          type: string
    OdrlAtomicConstraint:
      type: object
      required:
      - leftOperand
