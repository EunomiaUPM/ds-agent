      - rightOperand
      properties:
        leftOperand:
          type: string
        operator:
          $ref: '#/components/schemas/OdrlOperator'
        rightOperand:
          oneOf:
          - type: string
          - type: object
          - type: array
            items: {}
    OdrlConstraint:
      anyOf:
      - $ref: '#/components/schemas/OdrlAtomicConstraint'
      - $ref: '#/components/schemas/OdrlLogicalConstraint'
    OdrlDuty:
      type: object
      required:
      - action
      properties:
