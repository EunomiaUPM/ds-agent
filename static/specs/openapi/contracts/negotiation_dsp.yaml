          items:
            $ref: '#/components/schemas/OdrlConstraint'
        andSequence:
          type: array
          items:
            $ref: '#/components/schemas/OdrlConstraint'
        or:
          type: array
          items:
            $ref: '#/components/schemas/OdrlConstraint'
        xone:
          type: array
          items:
            $ref: '#/components/schemas/OdrlConstraint'
