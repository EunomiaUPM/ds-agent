openapi: 3.1.0
info:
  title: Eunomia DS Contract Negotiation Protocol API
  description: |
    Contract Negotiation Protocol of the Dataspace Protocol 2025-1 as served by the negotiation
    agent. The same endpoints serve both roles: a provider receives requests, verifications and
    events; a consumer receives offers, agreements and events. Protocol endpoints authenticate
    the peer with the token it obtained through GNAP onboarding; a missing process and a process
    of another peer both answer 404.

    The RPC endpoints make this agent send the next message of a negotiation; the BFF variants
    are the shortcuts the admin GUI uses (`setup-agreement` also verifies and finalizes).
  version: 1.0.0
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: http://127.0.0.1:1200
  description: Provider agent (dev)
- url: http://127.0.0.1:1100
  description: Consumer agent (dev)
tags:
- name: Negotiation Protocol
  description: DSP endpoints called by peers
- name: Negotiation RPC
  description: Messages this agent sends to a peer
- name: Negotiation BFF RPC
  description: Composite RPCs used by the admin GUI
paths:
  /dsp/current/negotiations/{id}:
    get:
      tags:
      - Negotiation Protocol
      operationId: getNegotiation
      summary: Negotiation state
      security:
      - peerBearer: []
      parameters:
      - $ref: '#/components/parameters/PidPath'
      responses:
        '200':
          $ref: '#/components/responses/NegotiationAck'
        '400':
          $ref: '#/components/responses/NegotiationError'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '404':
          $ref: '#/components/responses/NegotiationError'
  /dsp/current/negotiations/request:
    post:
      tags:
      - Negotiation Protocol
      operationId: initialContractRequest
      summary: Initial contract request (provider)
      description: Starts a negotiation; repeating a known request answers 200 instead of 201.
      security:
      - peerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractRequestInitMessage'
      responses:
        '200':
          $ref: '#/components/responses/NegotiationAck'
        '201':
          $ref: '#/components/responses/NegotiationAck'
        '400':
          $ref: '#/components/responses/NegotiationError'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
  /dsp/current/negotiations/{id}/request:
    post:
      tags:
      - Negotiation Protocol
      operationId: consumerRequest
      summary: Counter request (provider)
      security:
      - peerBearer: []
      parameters:
      - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractRequestMessage'
      responses:
        '200':
          $ref: '#/components/responses/NegotiationAck'
        '400':
          $ref: '#/components/responses/NegotiationError'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '404':
          $ref: '#/components/responses/NegotiationError'
  /dsp/current/negotiations/offers:
    post:
      tags:
      - Negotiation Protocol
      operationId: initialOffer
      summary: Initial contract offer (consumer)
      description: Starts a provider-initiated negotiation; a known offer answers 200 instead of 201.
      security:
      - peerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractOfferInitMessage'
      responses:
        '200':
          $ref: '#/components/responses/NegotiationAck'
        '201':
          $ref: '#/components/responses/NegotiationAck'
        '400':
          $ref: '#/components/responses/NegotiationError'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
  /dsp/current/negotiations/{id}/offers:
    post:
      tags:
      - Negotiation Protocol
      operationId: providerOffer
      summary: Counter offer (consumer)
      security:
      - peerBearer: []
      parameters:
      - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractOfferMessage'
      responses:
        '200':
          $ref: '#/components/responses/NegotiationAck'
        '400':
          $ref: '#/components/responses/NegotiationError'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '404':
          $ref: '#/components/responses/NegotiationError'
  /dsp/current/negotiations/{id}/agreement:
    post:
      tags:
      - Negotiation Protocol
      operationId: agreementReception
      summary: Contract agreement (consumer)
      security:
      - peerBearer: []
      parameters:
      - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractAgreementMessage'
      responses:
        '200':
          $ref: '#/components/responses/NegotiationAck'
        '400':
          $ref: '#/components/responses/NegotiationError'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '404':
          $ref: '#/components/responses/NegotiationError'
  /dsp/current/negotiations/{id}/agreement/verification:
    post:
      tags:
      - Negotiation Protocol
      operationId: agreementVerification
      summary: Agreement verification (provider)
      security:
      - peerBearer: []
      parameters:
      - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractAgreementVerificationMessage'
      responses:
        '200':
          $ref: '#/components/responses/NegotiationAck'
        '400':
          $ref: '#/components/responses/NegotiationError'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '404':
          $ref: '#/components/responses/NegotiationError'
  /dsp/current/negotiations/{id}/events:
    post:
      tags:
      - Negotiation Protocol
      operationId: negotiationEvents
      summary: Negotiation event (`ACCEPTED` to the provider, `FINALIZED` to the consumer)
      security:
      - peerBearer: []
      parameters:
      - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractNegotiationEventMessage'
      responses:
        '200':
          $ref: '#/components/responses/NegotiationAck'
        '400':
          $ref: '#/components/responses/NegotiationError'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '404':
          $ref: '#/components/responses/NegotiationError'
  /dsp/current/negotiations/{id}/termination:
    post:
      tags:
      - Negotiation Protocol
      operationId: negotiationTermination
      summary: Termination (either role)
      security:
      - peerBearer: []
      parameters:
      - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractNegotiationTerminationMessage'
      responses:
        '200':
          $ref: '#/components/responses/NegotiationAck'
        '400':
          $ref: '#/components/responses/NegotiationError'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '404':
          $ref: '#/components/responses/NegotiationError'
  /dsp/current/negotiations/rpc/setup-request-init:
    post:
      tags:
      - Negotiation RPC
      operationId: rpcSetupRequestInit
      summary: Send an initial contract request (consumer)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationRequestInitMessageDto'
      responses:
        '201':
          description: Request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationRequestInitResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/rpc/setup-request:
    post:
      tags:
      - Negotiation RPC
      operationId: rpcSetupRequest
      summary: Send a counter request (consumer)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationRequestMessageDto'
      responses:
        '201':
          description: Request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationRequestResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/rpc/setup-offer-init:
    post:
      tags:
      - Negotiation RPC
      operationId: rpcSetupOfferInit
      summary: Send an initial offer (provider)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationOfferInitMessageDto'
      responses:
        '201':
          description: Offer sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationOfferInitResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/rpc/setup-offer:
    post:
      tags:
      - Negotiation RPC
      operationId: rpcSetupOffer
      summary: Send a counter offer (provider)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationOfferMessageDto'
      responses:
        '201':
          description: Offer sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationOfferResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/rpc/setup-acceptance:
    post:
      tags:
      - Negotiation RPC
      operationId: rpcSetupAcceptance
      summary: Accept the current offer (consumer)
      description: Sends a `ContractNegotiationEventMessage` with event type `ACCEPTED`.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationPidsDto'
      responses:
        '201':
          description: Event sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationPidsResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/rpc/setup-agreement:
    post:
      tags:
      - Negotiation RPC
      operationId: rpcSetupAgreement
      summary: Send the agreement (provider)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationPidsDto'
      responses:
        '201':
          description: Agreement sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationPidsResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/rpc/setup-verification:
    post:
      tags:
      - Negotiation RPC
      operationId: rpcSetupVerification
      summary: Verify the agreement (consumer)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationPidsDto'
      responses:
        '201':
          description: Verification sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationPidsResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/rpc/setup-finalization:
    post:
      tags:
      - Negotiation RPC
      operationId: rpcSetupFinalization
      summary: Finalize the negotiation (provider)
      description: Sends a `ContractNegotiationEventMessage` with event type `FINALIZED`.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationPidsDto'
      responses:
        '201':
          description: Event sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationPidsResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/rpc/setup-termination:
    post:
      tags:
      - Negotiation RPC
      operationId: rpcSetupTermination
      summary: Terminate the negotiation (either role)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationTerminationMessageDto'
      responses:
        '201':
          description: Termination sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationTerminationResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/tck/negotiations/requests:
    post:
      tags:
      - Negotiation RPC
      operationId: tckInitiateNegotiation
      summary: Start a negotiation for the DSP TCK
      description: Builds an initial request referencing `offerId`, with this agent as callback.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TckNegotiationInitiateRequest'
      responses:
        '201':
          description: Request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationRequestInitResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/bff-rpc/setup-request-init:
    post:
      tags:
      - Negotiation BFF RPC
      operationId: bffRpcSetupRequestInit
      summary: Send an initial contract request (consumer)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationRequestInitMessageDto'
      responses:
        '201':
          description: Request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationRequestInitResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/bff-rpc/setup-offer-init:
    post:
      tags:
      - Negotiation BFF RPC
      operationId: bffRpcSetupOfferInit
      summary: Send an initial offer (provider)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationOfferInitMessageDto'
      responses:
        '201':
          description: Offer sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationOfferInitResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/bff-rpc/setup-acceptance:
    post:
      tags:
      - Negotiation BFF RPC
      operationId: bffRpcSetupAcceptance
      summary: Accept the current offer (consumer)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationPidsDto'
      responses:
        '201':
          description: Event sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationPidsResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/bff-rpc/setup-agreement:
    post:
      tags:
      - Negotiation BFF RPC
      operationId: bffRpcSetupAgreement
      summary: Agree, verify and finalize (provider)
      description: Sends the agreement, then the verification and the `FINALIZED` event.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationPidsDto'
      responses:
        '201':
          description: Result of the final `FINALIZED` event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationPidsResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dsp/current/negotiations/bff-rpc/setup-termination:
    post:
      tags:
      - Negotiation BFF RPC
      operationId: bffRpcSetupTermination
      summary: Terminate the negotiation (either role)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcNegotiationTerminationMessageDto'
      responses:
        '201':
          description: Termination sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcNegotiationTerminationResult'
        '400':
          $ref: '#/components/responses/RpcNegotiationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth access token (JWT) or personal access token issued by `/oauth`.
    peerBearer:
      type: http
      scheme: bearer
      description: Token the peer obtained from this agent through GNAP onboarding.
  parameters:
    PidPath:
      name: id
      in: path
      required: true
      description: This agent's process id (`providerPid` on a provider, `consumerPid` on a consumer).
      schema:
        type: string
    TenantHeader:
      name: x-tenant-id
      in: header
      required: false
      description: Tenant to act on. Non-admins may only name their own tenant.
      schema:
        type: string
  responses:
    NegotiationAck:
      description: Negotiation state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContractNegotiation'
    NegotiationError:
      description: Protocol error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContractNegotiationError'
    PeerUnauthorized:
      description: Missing or unknown peer token (empty body)
    RpcNegotiationError:
      description: Invalid request, or the peer or this agent rejected the message
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/RpcNegotiationErrorDto'
            - $ref: '#/components/schemas/ContractNegotiationError'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
  schemas:
    AgreementDto:
      type: object
      required:
      - id
      - tenantId
      - negotiationAgentProcessId
      - negotiationAgentMessageId
      - consumerParticipantId
      - providerParticipantId
      - agreementContent
      - target
      - state
      - createdAt
      properties:
        id:
          type: string
        tenantId:
          type: string
        negotiationAgentProcessId:
          type: string
        negotiationAgentMessageId:
          type: string
        consumerParticipantId:
          type: string
        providerParticipantId:
          type: string
        agreementContent:
          $ref: '#/components/schemas/OdrlAgreement'
        target:
          type: string
          description: URN of the dataset.
        state:
          type: string
          examples:
          - ACTIVE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
    ContextField:
      description: JSON-LD context; must include the DSP 2024-1 or 2025-1 context.
      oneOf:
      - type: string
      - type: array
        items:
          type: string
      examples:
      - https://w3id.org/dspace/2025/1/context.jsonld
    ContractAgreementMessage:
      type: object
      additionalProperties: false
      required:
      - '@context'
      - '@type'
      - consumerPid
      - providerPid
      - agreement
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: ContractAgreementMessage
        consumerPid:
          type: string
        providerPid:
          type: string
        agreement:
          $ref: '#/components/schemas/OdrlAgreement'
    ContractAgreementVerificationMessage:
      type: object
      additionalProperties: false
      required:
      - '@context'
      - '@type'
      - consumerPid
      - providerPid
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: ContractAgreementVerificationMessage
        consumerPid:
          type: string
        providerPid:
          type: string
    ContractNegotiation:
      type: object
      description: Negotiation acknowledgement.
      required:
      - '@context'
      - '@type'
      - consumerPid
      - providerPid
      - state
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: ContractNegotiation
        consumerPid:
          type: string
        providerPid:
          type: string
        state:
          $ref: '#/components/schemas/NegotiationProcessState'
    ContractNegotiationError:
      type: object
      required:
      - '@context'
      - '@type'
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: ContractNegotiationError
        consumerPid:
          type:
          - string
          - 'null'
        providerPid:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        reason:
          type:
          - array
          - 'null'
          items:
            type: string
    ContractNegotiationEventMessage:
      type: object
      additionalProperties: false
      required:
      - '@context'
      - '@type'
      - consumerPid
      - providerPid
      - eventType
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: ContractNegotiationEventMessage
        consumerPid:
          type: string
        providerPid:
          type: string
        eventType:
          type: string
          enum:
          - ACCEPTED
          - FINALIZED
    ContractNegotiationTerminationMessage:
      type: object
      additionalProperties: false
      required:
      - '@context'
      - '@type'
      - consumerPid
      - providerPid
      properties:
        '@context':
