          type: string
          enum:
          - Offer
          - Agreement
        profile:
          $ref: '#/components/schemas/OdrlProfile'
        permission:
          type: array
          items:
            $ref: '#/components/schemas/OdrlPermission'
        obligation:
          type: array
          items:
            $ref: '#/components/schemas/OdrlDuty'
        prohibition:
          type: array
          items:
            $ref: '#/components/schemas/OdrlDuty'
        target:
