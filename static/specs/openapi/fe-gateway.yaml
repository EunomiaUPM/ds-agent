  /oauth/token:
    post:
      tags:
      - OAuth
      operationId: createOAuthToken
      summary: Issue a token
      description: |
        Grants: `password`, `client_credentials` (secret via HTTP Basic or body, or a
        `private_key_jwt` client assertion), `authorization_code` (PKCE), `refresh_token` and
        `urn:ietf:params:oauth:grant-type:jwt-bearer`. Without `grant_type` it is inferred from the
        fields present.
      security:
      - {}
      - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
