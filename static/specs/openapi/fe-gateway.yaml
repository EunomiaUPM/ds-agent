        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth access token (JWT) or personal access token issued by `/oauth`.
    clientBasic:
      type: http
      scheme: basic
      description: OAuth client id and secret (`client_secret_basic`).
  headers:
    XTotalCount:
      description: Total number of matching items.
      schema:
        type: integer
    ETag:
      description: Weak tag of the stored version (`W/"3"`); on public routes, a strong tag of the body.
      schema:
        type: string
    Eunomia-Visibility:
      description: Private, Anonymous or Public.
      schema:
        $ref: '#/components/schemas/Visibility'
    Eunomia-Owner:
      description: User id of the owner.
      schema:
        type: string
    Eunomia-Owner-Role:
      description: Role path of the owner.
      schema:
        type: string
    X-Total-Count:
      description: Resources matching the filter.
      schema:
        type: integer
    X-Next-Cursor:
      description: Cursor of the next page, when there is one.
      schema:
        type: string
    Link:
      description: '`rel="next"` with the next cursor, or `rel="profile"` on public routes.'
      schema:
        type: string
    X-Shown-Count:
      description: Datasets and series a preview shows.
      schema:
        type: integer
    Content-Disposition:
      description: '`attachment; filename="…"` on a download.'
      schema:
        type: string
  parameters:
    CreatedAfter:
      name: created_after
      in: query
      required: false
      schema:
        type: string
        format: date-time
    CreatedAfterCamel:
      name: createdAfter
      in: query
      required: false
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      required: false
      schema:
        type: string
        format: date-time
    CreatedBeforeCamel:
      name: createdBefore
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `nextCursor` of the previous page.
      schema:
        type: string
    DataplaneProcessId:
      name: dataplaneProcessId
      in: path
      required: true
      description: URN of the dataplane process.
      schema:
        type: string
    EventId:
      name: eventId
      in: path
      required: true
      description: Event UUID, bare or as `urn:uuid:<uuid>`.
      schema:
        type: string
    GrantKindQuery:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum:
        - AccessToken
        - CredentialRequest
    GrantParticipantNick:
      name: participantNick
      in: query
      required: false
      schema:
        type: string
    GrantStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - Processing
        - Pending
        - Approved
        - Rejected
        - Finalized
    KeyPath:
      name: key
      in: path
      required: true
      description: Entry key without its leading `/`; may contain further `/` segments.
      schema:
        type: string
        examples:
        - connectors/http/token
    KeyPrefix:
      name: prefix
      in: query
      required: false
      description: Only entries whose key starts with this prefix.
      schema:
        type: string
        examples:
        - /connectors
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, clamped to 1..=100.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    PageNumber:
      name: page
      in: query
      required: false
      description: 1-based page index for offset paging, used when no cursor is sent.
      schema:
        type: integer
        minimum: 1
    ProcessIdPath:
      name: process_id
      in: path
      required: true
      description: URN of the process.
      schema:
        type: string
    SentGrantParticipantId:
      name: participantId
      in: query
      required: false
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
        - created_at_asc
        - created_at_desc
        - updated_at_asc
        - updated_at_desc
        default: created_at_desc
    StringPathId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TopicPattern:
      name: topic
      in: query
      required: false
      description: Topic pattern; `*` matches one segment, `**` any number of them.
      schema:
        type: string
        examples:
        - transfers:*
        - negotiations:**
    UrnPathId:
      name: id
      in: path
      required: true
      description: URN of the resource.
      schema:
        type: string
        examples:
        - urn:uuid:5b0f6a1e-2c3d-4e5f-8a9b-0c1d2e3f4a5b
    UserIdCamel:
      description: Only the records of this user, among those the caller sees.
      in: query
      name: userId
      required: false
      schema:
        type: string
    UserIdQuery:
      description: Only the records of this user, among those the caller sees.
      in: query
      name: user_id
      required: false
      schema:
        type: string
    VisibilityHeader:
      name: Eunomia-Visibility
      in: header
      required: false
      description: Who else sees the resource; private when absent.
      schema:
        $ref: '#/components/schemas/Visibility'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The `ETag` read (`W/"3"`); another stored version is a 412.
      schema:
        type: string
    ProfileQuery:
      name: profile
      in: query
      required: false
      description: 'One profile only: `dsp`, `dcat3` or `dcat-ap`.'
      schema:
        type: string
    DeepQuery:
      name: deep
      in: query
      required: false
      description: Diagnose the whole closure, not the resource alone.
      schema:
        type: boolean
        default: false
    ProfilePath:
      name: profile
      in: path
      required: true
      description: '`dsp`, `dcat3` or `dcat-ap`.'
      schema:
        type: string
        enum:
        - dsp
        - dcat3
        - dcat-ap
    DatasetLimitQuery:
      name: limit
      in: query
      required: false
      description: Datasets and series kept in a preview; all when absent.
      schema:
        type: integer
        minimum: 0
    RdfFormatQuery:
      name: format
      in: query
      required: false
      description: Syntax of the answer; without it the `Accept` header decides, JSON-LD by default.
      schema:
        type: string
        enum:
        - jsonld
        - turtle
        - ntriples
        - rdfxml
    DownloadQuery:
      name: download
      in: query
      required: false
      description: The whole document as an attachment; `limit` is ignored.
      schema:
        type: boolean
        default: false
    ImportProfileQuery:
      name: profile
      in: query
      required: false
      description: The profile whose shapes validate the document.
      schema:
        type: string
        enum:
        - dcat-ap
        - dcat3
        default: dcat-ap
    ImportModeQuery:
      name: mode
      in: query
      required: false
      description: '`upsert` replaces stored resources one version on; `create` refuses the document if any is stored.'
      schema:
        type: string
        enum:
        - upsert
        - create
        default: upsert
    DryRunQuery:
      name: dryRun
      in: query
      required: false
      description: Validate and plan without writing.
      schema:
        type: boolean
        default: false
    ImportTargetQuery:
      name: target
      in: query
      required: false
      description: A catalog (URN) the document's resources go into; its own catalogs are then not stored.
      schema:
        type: string
    ShaclChecksQuery:
      name: checks
      in: query
      required: false
      description: 'Shape groups, comma separated. DCAT-AP: `base`, `recommended`, `deprecated` (the default), `range` and `codelists` (need background knowledge). DCAT 3: `base`.'
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Conflict:
      description: The resource already exists or changed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Forbidden:
      description: The caller may not act on this tenant or resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    OAuthErrorResponse:
      description: RFC 6749 §5.2 error (`invalid_client` is a 401, `server_error` a 500)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    RpcNegotiationError:
      description: Invalid body (400), unknown negotiation (404), stale or repeated (409), or the peer
        refused it (502)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContractNegotiationError'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    PreconditionFailed:
      description: The resource changed since the version `If-Match` names
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    PeerUnauthorized:
      description: Missing or unknown peer token (empty body)
    ProtocolBadRequest:
      description: Invalid message or failed request, as plain text
      content:
        text/plain:
          schema:
            type: string
  schemas:
    AgentDocument:
      type: object
      description: A `Agent` (`foaf:Agent`) in the eunomia catalog context. Any other property is kept
        as sent, under its full or compact IRI.
      properties:
        '@context':
          description: '`https://w3id.org/eunomia/v1/catalog-context.jsonld`; any context works on input,
            it is read through RDF.'
          oneOf:
          - type: string
          - type: object
          - type: array
        '@id':
          type: string
          description: URN of the resource; minted when a body names none.
        '@type':
          description: The class term, e.g. `Dataset`.
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        title:
          $ref: '#/components/schemas/LanguageText'
        description:
          $ref: '#/components/schemas/LanguageText'
        issued:
          type: string
          format: date-time
          readOnly: true
          description: Set by the agent.
        modified:
          type: string
          format: date-time
          readOnly: true
          description: Set by the agent.
        identifier:
          type: string
        conformsTo:
          type: array
          items:
            type: string
            format: iri
        creator:
          type: string
          format: iri
        publisher:
          type: string
          format: iri
        license:
          type: string
          format: iri
        accessRights:
          type: string
          format: iri
        language:
          type: array
          items:
            type: string
          description: Language IRIs, or bare codes (`en`) that DCAT-AP maps to the EU language table.
        name:
          $ref: '#/components/schemas/LanguageText'
        dctType:
          type: string
          format: iri
      additionalProperties: true
    AgentGraph:
      type: object
      required:
