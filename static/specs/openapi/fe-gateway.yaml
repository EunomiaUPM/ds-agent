openapi: 3.1.0
info:
  title: Eunomia DS Frontend Gateway API
  description: |
    Admin API as the GUI sees it through the gateway agent (`crates/bff`). The gateway
    answers under `/admin/api` and forwards each path prefix to the agent that owns it
    (`catalogs` to the catalog agent, `negotiations` to the negotiation agent, `v1` to
    `/api/v1` of the core agent, and so on); the bearer token is forwarded and checked
    there. Mirrors the per-agent specs in this folder; operation ids
    and tags match the orval client in `gui/shared/src/data/orval`, and deprecated operations
    are calls the GUI still makes to routes the backend no longer serves.
  version: 1.0.0
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: '{gateway_url}/admin/api'
  description: Gateway agent
  variables:
    gateway_url:
      default: http://127.0.0.1:1200
security:
- bearerAuth: []
tags:
- name: Agents
  description: 'Agent CRUD: publishers, creators (→ catalog-agent)'
- name: CatalogRecords
  description: Catalog record CRUD (→ catalog-agent)
- name: CatalogRPC
  description: Catalog RPC commands (→ catalog-agent DSP)
- name: Catalogs
  description: Catalog CRUD operations (→ catalog-agent)
- name: Connector
  description: Connector instance queries (→ catalog-agent)
- name: ConnectorTemplates
  description: Connector template operations (→ catalog-agent)
- name: Dataplane Logs
  description: Dataplane log operations (→ transfer-agent)
- name: Dataplane Transfers
  description: Dataplane transfer operations (→ transfer-agent)
- name: DataServices
  description: Data-service CRUD operations (→ catalog-agent)
- name: Datasets
  description: Dataset CRUD operations (→ catalog-agent)
- name: DatasetSeries
  description: Dataset series CRUD (→ catalog-agent)
- name: DID
- name: Discovery
- name: Distributions
  description: Distribution CRUD operations (→ catalog-agent)
- name: Doctor
  description: Conformance of a catalog resource to DSP, DCAT 3 and DCAT-AP (→ catalog-agent)
- name: Catalog Exchange
  description: A catalog in any profile and RDF syntax, and DCAT imports validated with SHACL (→ catalog-agent)
- name: Events
  description: Real-time pub/sub event stream, audit feed, webhook subscriptions, and Dead Letter Queue
    (→ events / bff)
- name: Gaia
- name: GateKeeper
- name: Gateway
  description: Gateway-specific endpoints (config, notifications, websocket)
- name: Keystore Config
  description: Runtime application configuration (→ keystore)
- name: Keystore Parameters
  description: Plain key/value entries with full JSON value support (→ keystore)
- name: Keystore Secrets
  description: Sensitive key/value entries — values are masked in all responses (→ keystore)
- name: Mates
- name: NegotiationRPC
  description: Negotiation RPC commands (→ negotiation-agent)
- name: Negotiations
  description: Contract negotiation operations (→ negotiation-agent)
- name: OAuth
  description: OAuth 2.0 token, authorization, introspection, and user management (→ oauth)
- name: OAuth Clients
  description: OAuth 2.0 registered client applications (→ oauth)
- name: OAuth Users
- name: OdrlPolicies
  description: ODRL policy operations (→ catalog-agent)
- name: Onboard
- name: Participants
  description: Participant (mates) operations (→ auth-agent)
- name: Peer Catalogs
- name: Personal Access Tokens
  description: Personal Access Token (PAT) management (→ oauth)
- name: PolicyTemplates
  description: Policy template operations (→ catalog-agent)
- name: PublicProfiles
  description: Public catalog in each profile (→ catalog-agent)
- name: Transfer Events
  description: Transfer event operations (→ transfer-agent)
- name: TransferRPC
  description: Transfer RPC commands (→ transfer-agent)
- name: Transfers
  description: Transfer process operations (→ transfer-agent)
- name: VC Request
- name: Wallet
- name: WellKnown
  description: .well-known discovery endpoints
- name: WellKnownRPC
  description: .well-known RPC commands
paths:
  /agents:
    get:
      tags:
      - Agents
      operationId: getAllAgents
      summary: List Agents
      description: One page as a JSON-LD `@graph`; the total and the next cursor come in headers.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/UserIdQuery'
      - name: catalog_id
        in: query
        required: false
        description: Only resources of this catalog.
        schema:
          type: string
      - name: dataset_id
        in: query
        required: false
        description: Only distributions of this dataset.
        schema:
          type: string
      - name: title
        in: query
        required: false
        description: Part of the title, in any language.
        schema:
          type: string
      - name: keyword
        in: query
        required: false
        description: A `dcat:keyword`, exactly.
        schema:
          type: string
      - name: theme
        in: query
        required: false
        description: A `dcat:theme` IRI.
        schema:
          type: string
      - name: format
        in: query
        required: false
        description: A `dct:format`, literal (`http+pull`) or IRI.
        schema:
          type: string
      - name: creator
        in: query
        required: false
        description: A `dct:creator` IRI.
        schema:
          type: string
      - name: publisher
        in: query
        required: false
        description: A `dct:publisher` IRI.
        schema:
          type: string
      - name: conforms_to
        in: query
        required: false
        description: A `dct:conformsTo` IRI.
        schema:
          type: string
      - name: participant_id
        in: query
        required: false
        description: A `dspace:participantId`.
        schema:
          type: string
      - name: access_service
        in: query
        required: false
        description: A `dcat:accessService`.
        schema:
          type: string
      - name: endpoint_url
        in: query
        required: false
        description: A `dcat:endpointURL`.
        schema:
          type: string
      - name: main
        in: query
        required: false
        description: '`false` leaves out the connector''s main resource; `true` keeps only it.'
        schema:
          type: boolean
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of Agents
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/AgentGraph'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            X-Next-Cursor:
              $ref: '#/components/headers/X-Next-Cursor'
            Link:
              $ref: '#/components/headers/Link'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Agents
      operationId: createAgent
      summary: Create a Agent
      description: A `Agent` document in the catalog context (a body with no `@type` is taken as one).
      parameters:
      - $ref: '#/components/parameters/VisibilityHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDocument'
      responses:
        '201':
          description: Created Agent
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/AgentDocument'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Eunomia-Visibility:
              $ref: '#/components/headers/Eunomia-Visibility'
            Eunomia-Owner:
              $ref: '#/components/headers/Eunomia-Owner'
            Eunomia-Owner-Role:
              $ref: '#/components/headers/Eunomia-Owner-Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /agents/batch:
    post:
      tags:
      - Agents
      operationId: getBatchAgents
      summary: Agents by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequests'
      responses:
        '200':
          description: The Agents found
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/AgentGraph'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
