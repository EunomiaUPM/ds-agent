openapi: 3.1.0
info:
  title: Eunomia DS Frontend Gateway API
  description: |
    Admin API as the GUI sees it through the gateway agent (`crates/bff`). The gateway
    answers under `/admin/api` and forwards each path prefix to the agent that owns it
    (`catalogs` to the catalog agent, `negotiations` to the negotiation agent, `v1` to
    `/api/v1` of the core agent, and so on); the bearer token and `x-tenant-id` are
    forwarded and checked there. Mirrors the per-agent specs in this folder; operation ids
    and tags match the orval client in `gui/shared/src/data/orval`, and deprecated operations
    are calls the GUI still makes to routes the backend no longer serves.
  version: 1.0.0
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: '{gateway_url}/admin/api'
  description: Gateway agent
  variables:
    gateway_url:
      default: http://127.0.0.1:1200
security:
- bearerAuth: []
tags:
- name: CatalogRPC
  description: Catalog RPC commands (→ catalog-agent DSP)
- name: Catalogs
  description: Catalog CRUD operations (→ catalog-agent)
- name: Connector
  description: Connector instance queries (→ catalog-agent)
- name: ConnectorTemplates
  description: Connector template operations (→ catalog-agent)
- name: Dataplane Logs
  description: Dataplane log operations (→ transfer-agent)
- name: Dataplane Transfers
  description: Dataplane transfer operations (→ transfer-agent)
- name: DataServices
  description: Data-service CRUD operations (→ catalog-agent)
- name: Datasets
  description: Dataset CRUD operations (→ catalog-agent)
- name: DID
- name: Discovery
- name: Distributions
  description: Distribution CRUD operations (→ catalog-agent)
- name: Events
  description: Real-time pub/sub event stream, audit feed, webhook subscriptions, and Dead Letter Queue
    (→ events / bff)
- name: Gaia
- name: GateKeeper
- name: Gateway
  description: Gateway-specific endpoints (config, notifications, websocket)
- name: Keystore Config
  description: Runtime application configuration (→ keystore)
- name: Keystore Parameters
  description: Plain key/value entries with full JSON value support (→ keystore)
- name: Keystore Secrets
  description: Sensitive key/value entries — values are masked in all responses (→ keystore)
- name: Mates
- name: NegotiationRPC
  description: Negotiation RPC commands (→ negotiation-agent)
- name: Negotiations
  description: Contract negotiation operations (→ negotiation-agent)
- name: OAuth
  description: OAuth 2.0 token, authorization, introspection, and user management (→ oauth)
- name: OAuth Clients
  description: OAuth 2.0 registered client applications (→ oauth)
- name: OAuth Users
- name: OdrlPolicies
  description: ODRL policy operations (→ catalog-agent)
- name: Onboard
- name: Participants
  description: Participant (mates) operations (→ auth-agent)
- name: Peer Catalogs
- name: Personal Access Tokens
  description: Personal Access Token (PAT) management (→ oauth)
- name: PolicyTemplates
  description: Policy template operations (→ catalog-agent)
- name: Tenants
- name: Transfer Events
  description: Transfer event operations (→ transfer-agent)
- name: TransferRPC
  description: Transfer RPC commands (→ transfer-agent)
- name: Transfers
  description: Transfer process operations (→ transfer-agent)
- name: VC Request
- name: Wallet
- name: WellKnown
  description: .well-known discovery endpoints
- name: WellKnownRPC
  description: .well-known RPC commands
paths:
  /catalogs:
    get:
      tags:
      - Catalogs
      operationId: getCatalogs
      summary: List catalogs
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/TenantIdQuery'
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: creator
        in: query
        required: false
        schema:
          type: string
      - name: participant_id
        in: query
        required: false
        schema:
          type: string
      - name: with_main_catalog
        in: query
        required: false
        description: Include the tenant's main catalog in the listing.
        schema:
          type: boolean
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of catalogs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Catalogs
      operationId: createCatalog
      summary: Create a catalog
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCatalogDto'
      responses:
        '201':
          description: Created catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/batch:
    post:
      tags:
      - Catalogs
      operationId: getBatchCatalogs
      summary: Get several catalogs by id
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequests'
      responses:
        '200':
          description: Catalogs found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /catalogs/main:
    get:
      tags:
      - Catalogs
      operationId: getMainCatalogs
      summary: The tenant's main catalog
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Main catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Catalogs
      operationId: createMainCatalog
      summary: Create the tenant's main catalog
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCatalogDto'
      responses:
        '201':
          description: Created main catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    - $ref: '#/components/parameters/TenantHeader'
    get:
      tags:
      - Catalogs
      operationId: getCatalogById
      summary: Get a catalog
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Catalogs
      operationId: updateCatalog
      summary: Update a catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCatalogDto'
      responses:
        '202':
          description: Updated catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Catalogs
      operationId: deleteCatalog
      summary: Delete a catalog
      responses:
        '202':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /connector/instances:
    post:
      tags:
      - Connector
      operationId: upsertConnectorInstance
      summary: Create or replace the instance of a distribution
      description: |
        Validates the parameters against the template, adds system parameters, resolves every
        placeholder and stores the result. With `dryRun` the instance is resolved but not stored.
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorInstantiationDto'
      responses:
        '200':
          description: Resolved instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInstanceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /connector/instances/distribution/{distributionId}:
    get:
      tags:
      - Connector
      operationId: getConnectorInstanceByDistribution
      summary: Get the instance of a distribution
      parameters:
      - name: distributionId
        in: path
        required: true
        schema:
          type: string
          examples:
          - urn:uuid:5b0f6a1e-2c3d-4e5f-8a9b-0c1d2e3f4a5b
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInstanceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /connector/instances/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    - $ref: '#/components/parameters/TenantHeader'
    get:
      tags:
      - Connector
      operationId: getConnectorInstanceById
      summary: Get a connector instance
      responses:
        '200':
          description: Instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInstanceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Connector
      operationId: deleteConnectorInstanceById
      summary: Delete a connector instance
      responses:
        '202':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /connector/templates:
    get:
      tags:
      - ConnectorTemplates
      operationId: getConnectorTemplates
      summary: List connector templates
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - name: tenant_id
        in: query
        required: false
        schema:
          type: string
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: author
        in: query
        required: false
        schema:
          type: string
      - name: version
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConnectorTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - ConnectorTemplates
      operationId: createConnectorTemplate
      summary: Create a connector template
      description: |
        Every placeholder used in `authentication` or `interaction` must be declared in
        `parameters`, and every declared parameter must be used.
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorTemplateDto'
      responses:
        '200':
          description: Stored template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorTemplateDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /connector/templates/{name}:
    get:
      tags:
      - ConnectorTemplates
      operationId: getConnectorTemplate
      summary: Every version of a template
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Versions of the template
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectorTemplateDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /connector/templates/{name}/{version}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    - name: version
      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/TenantHeader'
    get:
      tags:
      - ConnectorTemplates
      operationId: getConnectorTemplateByNameVersion
      summary: Get one template version
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorTemplateDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - ConnectorTemplates
      operationId: deleteConnectorTemplate
      summary: Delete one template version
      responses:
        '202':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /data-services:
    get:
      tags:
      - DataServices
      operationId: getAllDataServices
      summary: List data services
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/TenantIdQuery'
      - name: catalog_id
        in: query
        required: false
        schema:
          type: string
      - name: endpoint_url
        in: query
        required: false
        schema:
          type: string
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: creator
        in: query
        required: false
        schema:
          type: string
      - name: main_data_service
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of data services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDataServiceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - DataServices
      operationId: createDataService
      summary: Create a data service
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDataServiceDto'
      responses:
        '200':
          description: Created data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataServiceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /data-services/batch:
    post:
      tags:
      - DataServices
      operationId: getBatchDataServices
      summary: Get several data services by id
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequests'
      responses:
        '200':
          description: Data services found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataServiceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /data-services/catalog/{id}:
    get:
      tags:
      - DataServices
      operationId: getDataServicesByCatalogId
      summary: Data services of a catalog
      parameters:
      - $ref: '#/components/parameters/UrnPathId'
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Data services of the catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataServiceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /data-services/main:
    get:
      tags:
      - DataServices
      operationId: getMainDataService
      summary: The tenant's main data service
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Main data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataServiceDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - DataServices
      operationId: createMainDataService
      summary: Create the tenant's main data service
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDataServiceDto'
      responses:
        '200':
          description: Created main data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataServiceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /data-services/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    - $ref: '#/components/parameters/TenantHeader'
    get:
      tags:
      - DataServices
      operationId: getDataServiceById
      summary: Get a data service
      responses:
        '200':
          description: Data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataServiceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - DataServices
      operationId: updateDataService
      summary: Update a data service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditDataServiceDto'
      responses:
        '200':
          description: Updated data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataServiceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - DataServices
      operationId: deleteDataService
      summary: Delete a data service
      responses:
        '202':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /dataset-offerings:
    post:
      tags:
      - Catalogs
      operationId: createDatasetOffering
      summary: Publish a dataset with its distribution and policy
      description: |
        Without `dataset.catalogId` the dataset goes to the tenant's main catalog; without
        `distribution.accessServiceId` the distribution uses the main data service.
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDatasetOfferingDto'
      responses:
        '201':
          description: Created entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetOfferingDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /datasets:
    get:
      tags:
      - Datasets
      operationId: getAllDatasets
      summary: List datasets
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/TenantIdQuery'
      - name: catalog_id
        in: query
        required: false
        schema:
          type: string
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: creator
        in: query
        required: false
        schema:
          type: string
      - name: conforms_to
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of datasets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDatasetDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Datasets
      operationId: createDataset
      summary: Create a dataset
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDatasetDto'
      responses:
        '200':
          description: Created dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /datasets/batch:
    post:
      tags:
      - Datasets
      operationId: getBatchDatasets
      summary: Get several datasets by id
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
