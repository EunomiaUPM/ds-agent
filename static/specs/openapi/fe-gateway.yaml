      type: object
      required:
      - id
      - userId
      - userRole
      - visibility
      - role
      - protocol
      - state
      - stateMetadata
      - correlation
      - properties
      - createdAt
      - updatedAt
      - version
      properties:
        id:
          type: string
          description: URN of the transfer process.
        userId:
          description: Author of the record (`system` when a peer opened it).
          type: string
        userRole:
          description: Role the record was created under (or that handles it).
          examples:
          - /admin/upm
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        role:
          type: string
          description: Capitalised forms are accepted on input.
          enum:
          - provider
          - consumer
          - relay
        protocol:
          type: string
          enum:
          - dsp2024
          - dsp2025_1
        state:
          type: string
          description: Protocol state, e.g. `REQUESTED`, `STARTED`, `SUSPENDED`, `COMPLETED`, `TERMINATED`.
        stateMetadata:
          $ref: '#/components/schemas/TransferStateMetadata'
        correlation:
          $ref: '#/components/schemas/TransferCorrelation'
        properties:
          description: Free-form JSON.
        errorDetails:
          description: Last error, any JSON value.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic concurrency version.
    TransferRPCCompletionBody:
      type: object
      additionalProperties: false
      required:
      - '@context'
      - '@type'
      - '@id'
      properties:
        '@context':
          type: string
          const: https://w3id.org/eunomia/v1/context.jsonld
        '@type':
          type: string
          const: RpcTransferCompletionMessage
        '@id':
          type: string
          description: URN of the process on this agent (its `id`), never a DSP pid.
    TransferRPCRequestBody:
      type: object
      additionalProperties: false
      required:
      - '@context'
      - '@type'
      - associatedAgentPeer
      - providerAddress
      - callbackAddress
      - agreementId
      - format
      properties:
        '@context':
          type: string
          const: https://w3id.org/eunomia/v1/context.jsonld
        '@type':
          type: string
          const: RpcTransferRequestMessage
        associatedAgentPeer:
          type: string
        providerAddress:
          type: string
        callbackAddress:
          type: string
        agreementId:
          type: string
        format:
          type: string
        dataAddress:
          $ref: '#/components/schemas/DataAddressDto'
        autoStart:
          type: boolean
          description: Asks the provider to start the transfer as soon as it accepts the request (`eunomia:autoStart`
            on the DSP request).
    TransferRPCStartBody:
      type: object
      additionalProperties: false
      required:
      - '@context'
      - '@type'
      - '@id'
      properties:
        '@context':
          type: string
          const: https://w3id.org/eunomia/v1/context.jsonld
        '@type':
          type: string
          const: RpcTransferStartMessage
        '@id':
          type: string
          description: URN of the process on this agent (its `id`), never a DSP pid.
        dataAddress:
          $ref: '#/components/schemas/DataAddressDto'
    TransferRPCSuspensionBody:
      type: object
      additionalProperties: false
      required:
      - '@context'
      - '@type'
      - '@id'
      - code
      properties:
        '@context':
          type: string
          const: https://w3id.org/eunomia/v1/context.jsonld
        '@type':
          type: string
          const: RpcTransferSuspensionMessage
        '@id':
          type: string
          description: URN of the process on this agent (its `id`), never a DSP pid.
        code:
          type: string
        reason:
          type: array
          items:
            type: string
    TransferRPCTerminationBody:
      type: object
      additionalProperties: false
      required:
      - '@context'
      - '@type'
      - '@id'
      - code
      properties:
        '@context':
          type: string
          const: https://w3id.org/eunomia/v1/context.jsonld
        '@type':
          type: string
          const: RpcTransferTerminationMessage
        '@id':
          type: string
          description: URN of the process on this agent (its `id`), never a DSP pid.
        code:
          type: string
        reason:
          type: array
          items:
            type: string
    TransferStateMetadata:
      type: object
      description: Attribute, reasons and code of the current state, such as a termination cause.
      properties:
        attribute:
          type:
          - string
          - 'null'
        reason:
          type:
          - array
          - 'null'
          items:
            type: string
        code:
          type:
          - string
          - 'null'
    UpdateSubscriptionCommand:
      type: object
      properties:
        callback_address:
          type:
          - string
          - 'null'
          format: uri
        topic_pattern:
          type:
          - string
          - 'null'
        secret:
          type:
          - string
          - 'null'
        headers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        retry_limit:
          type:
          - integer
          - 'null'
        active:
          type:
          - boolean
          - 'null'
        expiration_time:
          type:
          - string
          - 'null'
          format: date-time
    VCRequestDto:
      $ref: '#/components/schemas/SentGrant'
    VcTypeConfig:
      type: string
      description: Credential type and format joined by `_`, with `:` in the type written as `_`.
      examples:
      - gx_LegalPerson_jwt_vc_json
      - DataSpaceParticipant_jwt_vc_json
    Version:
      type: object
      required:
      - binding
      - path
      - version
      properties:
        binding:
          type: string
          enum:
          - HTTPS
          - HTTP
        path:
          type: string
          description: Path where the DSP version is mounted.
          examples:
          - /dsp/current
        version:
          type: string
          enum:
          - 2024-1
          - 2025-1
        auth:
          oneOf:
          - $ref: '#/components/schemas/Auth'
          - type: 'null'
        identifierType:
          type:
          - string
          - 'null'
          enum:
          - did:web
          - did:jwk
          - url
          - D-U-N-S
          - null
        serviceId:
          type:
          - string
          - 'null'
          description: URN derived from the DSP path, stable across restarts.
    VersionPath:
      type: object
      required:
      - path
      properties:
        path:
          type: string
          format: uri
    VersionResponse:
      type: object
      required:
      - protocolVersions
      properties:
        protocolVersions:
          type: array
          items:
            $ref: '#/components/schemas/Version'
    Visibility:
      type: string
      description: |
        Who else sees a record beyond those its role lets in: nobody (Private), everyone without
        its author (Anonymous), or everyone (Public).
      enum:
      - Private
      - Anonymous
      - Public
    WalletCredential:
      type: object
      required:
      - id
      - vc_body
      - vc_type
      - vc_format
      - holder_did
      - issuer_did
      - parsed_document
      - added_on
      properties:
        id:
          type: string
        vc_body:
          description: The credential as issued (JWT or JSON-LD).
        vc_type:
          type: string
          examples:
          - gx:LegalPerson
        vc_format:
          type: string
          examples:
          - jwt_vc_json
        holder_did:
          type: string
        issuer_did:
          type: string
        parsed_document:
          description: Decoded credential.
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
        added_on:
          type: string
          format: date-time
    WalletDid:
      type: object
      required:
      - id
      - did
      - alias
      - default
      - type
      - keys
      - default_key
      - did_document
      properties:
        id:
          type: string
        did:
          type: string
        alias:
          type: string
        default:
          type: boolean
        type:
          type: string
          examples:
          - Jwk
          - Web
        keys:
          type: array
          items:
            type: object
            properties:
              internal:
                type: string
              fragment:
                type: string
        default_key:
          type: object
          properties:
            internal:
              type: string
            fragment:
              type: string
        did_document:
          $ref: '#/components/schemas/DidDocument'
        service:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DidService'
    WalletInfo:
      type: object
      required:
      - id
      - name
      - createdOn
      - addedOn
      - permission
      - dids
      properties:
        id:
          type: string
        name:
          type: string
        createdOn:
          type: string
        addedOn:
          type: string
        permission:
          type: string
        dids:
          type: array
          items:
            $ref: '#/components/schemas/WalletDid'
    WalletKey:
      type: object
      required:
      - id
      - alias
      - kty
      - created_at
      properties:
        id:
          type: string
        alias:
          type: string
        kty:
          type: string
          enum:
          - EC
          - RSA
          - oct
          - OKP
          - AKP
        crv:
          type:
          - string
          - 'null'
          examples:
          - P-256
          - Ed25519
          - X25519
        created_at:
          type: string
          format: date-time
    WellKnownRPCRequest:
      type: object
      required:
      - participant_id
      properties:
        participant_id:
          type: string
