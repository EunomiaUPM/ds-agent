      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    participant_id:
                      type: string
                    role:
                      description: Role path the relation was created under, e.g. `/admin/upm`.
                      type: string
                    user_id:
                      description: Who added the participant; masked for anonymous relations the caller
                        does not reach.
                      type: string
                    username:
                      description: Never given for Anonymous relations.
                      type:
                      - string
                      - 'null'
                    visibility:
                      $ref: '#/components/schemas/Visibility'
                  required:
                  - user_id
                  - participant_id
                  - role
                  - visibility
                  type: object
                type: array
          description: Relations
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Who added a participant
      tags:
      - Participants
