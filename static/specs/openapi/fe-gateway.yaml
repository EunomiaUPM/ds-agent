            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          $ref: '#/components/responses/OAuthErrorResponse'
        '401':
          $ref: '#/components/responses/OAuthErrorResponse'
        '500':
          $ref: '#/components/responses/OAuthErrorResponse'
