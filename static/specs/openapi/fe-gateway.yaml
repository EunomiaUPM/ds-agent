        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth access token (JWT) or personal access token issued by `/oauth`.
    clientBasic:
      type: http
      scheme: basic
      description: OAuth client id and secret (`client_secret_basic`).
  headers:
    XTotalCount:
      description: Total number of matching items.
      schema:
        type: integer
  parameters:
    CreatedAfter:
      name: created_after
      in: query
      required: false
      schema:
        type: string
        format: date-time
    CreatedAfterCamel:
      name: createdAfter
      in: query
      required: false
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      required: false
      schema:
        type: string
        format: date-time
    CreatedBeforeCamel:
      name: createdBefore
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `nextCursor` of the previous page.
      schema:
        type: string
    DataplaneProcessId:
      name: dataplaneProcessId
      in: path
      required: true
      description: URN of the dataplane process.
      schema:
        type: string
    EventId:
      name: eventId
      in: path
      required: true
      description: Event UUID, bare or as `urn:uuid:<uuid>`.
      schema:
        type: string
    GrantKindQuery:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum:
        - AccessToken
        - CredentialRequest
    GrantParticipantNick:
      name: participantNick
      in: query
      required: false
      schema:
        type: string
    GrantStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - Processing
        - Pending
        - Approved
        - Rejected
        - Finalized
    KeyPath:
      name: key
      in: path
      required: true
      description: Entry key without its leading `/`; may contain further `/` segments.
      schema:
        type: string
        examples:
        - connectors/http/token
    KeyPrefix:
      name: prefix
      in: query
      required: false
      description: Only entries whose key starts with this prefix.
      schema:
        type: string
        examples:
        - /connectors
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, clamped to 1..=100.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    PageNumber:
      name: page
      in: query
      required: false
      description: 1-based page index for offset paging, used when no cursor is sent.
      schema:
        type: integer
        minimum: 1
    ProcessIdPath:
      name: process_id
      in: path
      required: true
      description: URN of the process.
      schema:
        type: string
    SentGrantParticipantId:
      name: participantId
      in: query
      required: false
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
        - created_at_asc
        - created_at_desc
        - updated_at_asc
        - updated_at_desc
        default: created_at_desc
    StringPathId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TenantHeader:
      name: x-tenant-id
      in: header
      required: false
      description: Tenant to act on. Non-admins may only name their own tenant.
      schema:
        type: string
    TenantIdCamel:
      name: tenantId
      in: query
      required: false
      description: Tenant filter, honoured for admins.
      schema:
        type: string
    TenantIdQuery:
      name: tenant_id
      in: query
      required: false
      description: Tenant filter, honoured for admins.
      schema:
        type: string
    TopicPattern:
      name: topic
      in: query
      required: false
      description: Topic pattern; `*` matches one segment, `**` any number of them.
      schema:
        type: string
        examples:
        - transfers:*
        - negotiations:**
    UrnPathId:
      name: id
      in: path
      required: true
      description: URN of the resource.
      schema:
        type: string
        examples:
        - urn:uuid:5b0f6a1e-2c3d-4e5f-8a9b-0c1d2e3f4a5b
  responses:
    BadRequest:
      description: Malformed request or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Conflict:
      description: The resource already exists or changed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Forbidden:
      description: The caller may not act on this tenant or resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    OAuthErrorResponse:
      description: RFC 6749 §5.2 error (`invalid_client` is a 401, `server_error` a 500)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    RpcNegotiationError:
      description: Invalid request, or the peer or this agent rejected the message
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/RpcNegotiationErrorDto'
            - $ref: '#/components/schemas/ContractNegotiationError'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
  schemas:
    AgreementDto:
      type: object
      required:
      - id
      - tenantId
      - negotiationAgentProcessId
      - negotiationAgentMessageId
      - consumerParticipantId
      - providerParticipantId
      - agreementContent
      - target
      - state
      - createdAt
      properties:
        id:
          type: string
        tenantId:
          type: string
        negotiationAgentProcessId:
          type: string
        negotiationAgentMessageId:
          type: string
        consumerParticipantId:
          type: string
        providerParticipantId:
          type: string
        agreementContent:
          $ref: '#/components/schemas/OdrlAgreement'
        target:
          type: string
          description: URN of the dataset.
        state:
          type: string
          examples:
          - ACTIVE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
    ApiKey:
      type: object
      required:
      - type
      - key
      - value
      - location
      properties:
        type:
          type: string
          const: API_KEY
        key:
          type: string
          description: Header or query parameter name.
        value:
          $ref: '#/components/schemas/SecretString'
        location:
          type: string
          enum:
          - HEADER
          - QUERY
    Auth:
      type: object
      required:
      - protocol
      - version
      properties:
        protocol:
          type: string
          enum:
          - OAuth
          - Token
          - GNAP
        version:
          type: string
        profile:
          type: array
          items:
            type: string
    AuthenticationConfig:
      oneOf:
      - $ref: '#/components/schemas/NoAuth'
      - $ref: '#/components/schemas/BasicAuthConfig'
      - $ref: '#/components/schemas/BearerToken'
      - $ref: '#/components/schemas/ApiKey'
      - $ref: '#/components/schemas/OAuth2'
      discriminator:
        propertyName: type
        mapping:
          NO_AUTH: '#/components/schemas/NoAuth'
          BASIC_AUTH: '#/components/schemas/BasicAuthConfig'
          BEARER_TOKEN: '#/components/schemas/BearerToken'
          API_KEY: '#/components/schemas/ApiKey'
          OAUTH2: '#/components/schemas/OAuth2'
    BasicAuthConfig:
      type: object
      required:
      - type
      - username
      - password
      properties:
        type:
          type: string
          const: BASIC_AUTH
        username:
          type: string
        password:
          $ref: '#/components/schemas/SecretString'
    BatchRequests:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          description: URNs to look up.
          items:
            type: string
    BatchRequestsAsString:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: string
    BearerToken:
      type: object
      required:
      - type
      - token
      properties:
        type:
          type: string
          const: BEARER_TOKEN
        token:
          $ref: '#/components/schemas/SecretString'
    CatalogDto:
      type: object
      required:
      - id
      - tenantId
      - dctIssued
      - dspaceMainCatalog
      properties:
        id:
          type: string
          description: URN of the catalog.
        tenantId:
          type: string
        foafHomePage:
          type:
          - string
          - 'null'
        dctConformsTo:
          type:
          - string
          - 'null'
        dctCreator:
          type:
          - string
          - 'null'
        dctIdentifier:
          type:
          - string
          - 'null'
        dctIssued:
          type: string
          format: date-time
        dctModified:
          type:
          - string
          - 'null'
          format: date-time
        dctTitle:
          type:
          - string
          - 'null'
        dspaceParticipantId:
          type:
          - string
          - 'null'
        dspaceMainCatalog:
          type: boolean
    ConnectorInstanceDto:
      description: Instance metadata, flattened, plus its resolved configuration.
      allOf:
      - $ref: '#/components/schemas/ConnectorMetadata'
      - type: object
        required:
        - id
        - authenticationConfig
        - interaction
        - distributionId
        properties:
          id:
            type: string
            description: URN of the instance.
          authenticationConfig:
            $ref: '#/components/schemas/AuthenticationConfig'
          interaction:
            $ref: '#/components/schemas/InteractionConfig'
          distributionId:
            type: string
            description: URN of the distribution.
    ConnectorInstantiationDto:
      type: object
      required:
      - templateName
      - templateVersion
      - distributionId
      - parameters
      properties:
        templateName:
          type: string
        templateVersion:
          type: string
        distributionId:
          type: string
          description: URN of the distribution.
        parameters:
          type: object
          description: Values by parameter name; undeclared names are ignored.
          additionalProperties: true
        metadata:
          $ref: '#/components/schemas/InstanceMetadataDto'
        dryRun:
          type: boolean
          default: false
          description: Resolve and validate without storing.
        tenantId:
          type:
          - string
          - 'null'
          description: Target tenant, honoured for admins.
    ConnectorMetadata:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        author:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        version:
          type:
          - string
          - 'null'
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
    ConnectorParameterDefinition:
      type: object
      required:
      - name
      - title
      - paramType
      - required
      properties:
        name:
          type: string
          description: Placeholder name, used as `{{__NAME__}}`.
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        paramType:
          type: string
          enum:
          - STRING
          - INT
          - BOOLEAN
          - VEC<STRING>
          - MAP<STRING,STRING>
        required:
          type: boolean
        defaultValue:
          type:
          - string
          - 'null'
    ConnectorTemplateDto:
      description: Template metadata, flattened, plus its parameterised sections.
      allOf:
      - $ref: '#/components/schemas/ConnectorMetadata'
      - type: object
        required:
        - authentication
        - interaction
        - parameters
        properties:
          authentication:
            $ref: '#/components/schemas/AuthenticationConfig'
          interaction:
            $ref: '#/components/schemas/InteractionConfig'
          parameters:
            type: array
            description: One declaration per placeholder used in the template.
            items:
              $ref: '#/components/schemas/ConnectorParameterDefinition'
    ContextField:
      description: JSON-LD context; must include the DSP 2024-1 or 2025-1 context.
      oneOf:
      - type: string
      - type: array
        items:
          type: string
      examples:
      - https://w3id.org/dspace/2025/1/context.jsonld
    ContractNegotiation:
      type: object
      description: Negotiation acknowledgement.
      required:
      - '@context'
      - '@type'
      - consumerPid
      - providerPid
      - state
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: ContractNegotiation
        consumerPid:
          type: string
        providerPid:
          type: string
        state:
          type: string
          enum:
          - REQUESTED
          - OFFERED
          - ACCEPTED
          - AGREED
          - VERIFIED
          - FINALIZED
          - TERMINATED
    ContractNegotiationError:
      type: object
      required:
      - '@context'
      - '@type'
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: ContractNegotiationError
        consumerPid:
          type:
          - string
          - 'null'
        providerPid:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        reason:
          type:
          - array
          - 'null'
          items:
            type: string
    ContractRequestOffer:
      oneOf:
      - $ref: '#/components/schemas/OdrlMessageOffer'
      - $ref: '#/components/schemas/OdrlOfferReference'
    CreateClientCommand:
      type: object
      required:
      - clientId
      - clientSecret
      - clientName
      - role
      properties:
        clientId:
          type: string
        tenantId:
          type:
          - string
          - 'null'
          description: Owner tenant, honoured for admins.
        clientSecret:
          type: string
          format: password
        clientName:
          type: string
        role:
          type: string
          enum:
          - admin
          - owner
          - reader
        scopes:
          type: array
          items:
            type: string
    CreateDatasetOfferingRequest:
      $ref: '#/components/schemas/NewDatasetOfferingDto'
    CreatePatCommand:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Without it the token never expires.
    CreatePatResponse:
      type: object
      required:
      - id
      - name
      - token
      - tokenPrefix
      - role
      - scopes
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: Raw token; shown only once.
        tokenPrefix:
          type: string
        role:
          type: string
          enum:
          - admin
          - owner
          - reader
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateSubscriptionCommand:
      type: object
      required:
      - callback_address
      - topic_pattern
      properties:
        tenant_id:
          type:
          - string
          - 'null'
          description: Ignored; the subscription belongs to the acting tenant.
        callback_address:
          type: string
          format: uri
        topic_pattern:
          type: string
        secret:
          type:
          - string
          - 'null'
        headers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        retry_limit:
          type:
          - integer
          - 'null'
        expiration_time:
          type:
          - string
          - 'null'
          format: date-time
    CreateUserCommand:
      type: object
      required:
      - tenantId
      - email
      - password
      - role
      properties:
        tenantId:
          type: string
          description: Tenant of the user, which is also its identifier.
        email:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum:
          - admin
          - owner
          - reader
        extraFields:
          description: Free-form JSON stored with the user.
    DataAddressDto:
      type: object
      description: Data address as the GUI builds it; the wire form adds the `@type` tags.
      required:
      - endpointType
      properties:
        endpointType:
          type: string
        endpoint:
          type:
          - string
          - 'null'
        endpointProperties:
          type:
          - array
          - 'null'
          items:
            type: object
            required:
            - name
            - value
            properties:
              name:
                type: string
              value:
                type: string
    DataServiceDto:
      type: object
      required:
      - id
      - tenantId
      - dcatEndpointUrl
      - dctIssued
      - catalogId
      - dspaceMainDataService
      properties:
        id:
          type: string
          description: URN of the data service.
        tenantId:
          type: string
        dcatEndpointDescription:
          type:
          - string
          - 'null'
        dcatEndpointUrl:
          type: string
        dctConformsTo:
          type:
          - string
          - 'null'
        dctCreator:
          type:
          - string
          - 'null'
        dctIdentifier:
          type:
          - string
          - 'null'
        dctIssued:
          type: string
          format: date-time
        dctModified:
          type:
          - string
          - 'null'
          format: date-time
        dctTitle:
          type:
          - string
          - 'null'
        dctDescription:
          type:
          - string
          - 'null'
        catalogId:
          type: string
        dspaceMainDataService:
          type: boolean
    DataplaneInfoResponse:
      type: object
      required:
      - id
      - interaction_mode
      properties:
        id:
          type: string
        interaction_mode:
          type: string
          examples:
          - Pull
        ingress_url:
          type:
          - string
          - 'null'
    DataplaneTransferDto:
      type: object
      required:
      - id
      - tenantId
      - transferProcessId
      - role
      - interactionMode
      - state
      - ingressConfig
      - egressConfig
      - createdAt
      - fields
      - logs
      properties:
        id:
          type: string
          description: URN of the dataplane process.
        tenantId:
          type: string
        transferProcessId:
          type: string
        role:
          type: string
          enum:
          - Provider
          - Consumer
        interactionMode:
          type: string
          enum:
          - Pull
          - Push
        state:
          type: string
          enum:
          - Init
          - Configuring
          - Auth
          - Ready
          - Subscribing
          - Started
          - Unsubscribing
          - Stopped
          - Terminated
          - Error
        connectorInstanceId:
          type:
          - string
          - 'null'
        ingressConfig:
          description: Where data enters the dataplane, any JSON value.
        egressConfig:
          description: Where data leaves the dataplane, any JSON value.
        flowControl:
          description: Flow control settings, any JSON value.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        fields:
          type: object
          description: Extra key/value fields of the process.
          additionalProperties:
            type: string
        logs:
          type: array
          items:
            $ref: '#/components/schemas/DataplaneTransferLogDto'
    DataplaneTransferLogDto:
      type: object
      required:
      - id
      - tenant_id
      - dataplane_process_id
      - new_state
      - trigger
      - created_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        dataplane_process_id:
          type: string
        previous_state:
          oneOf:
          - type: string
            enum:
            - Init
            - Configuring
            - Auth
            - Ready
            - Subscribing
            - Started
            - Unsubscribing
            - Stopped
            - Terminated
            - Error
          - type: 'null'
        new_state:
          type: string
          enum:
          - Init
          - Configuring
          - Auth
          - Ready
          - Subscribing
          - Started
          - Unsubscribing
          - Stopped
          - Terminated
          - Error
        trigger:
          type: string
        reason:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    Dataset:
      $ref: '#/components/schemas/DspDataset'
    DatasetDto:
      type: object
      required:
      - id
      - tenantId
      - dctIssued
      - catalogId
      properties:
        id:
          type: string
          description: URN of the dataset.
        tenantId:
          type: string
        dctConformsTo:
          type:
          - string
          - 'null'
        dctCreator:
          type:
          - string
          - 'null'
        dctIdentifier:
          type:
          - string
          - 'null'
        dctIssued:
          type: string
          format: date-time
        dctModified:
          type:
          - string
          - 'null'
          format: date-time
        dctTitle:
          type:
          - string
          - 'null'
        dctDescription:
          type:
          - string
          - 'null'
        catalogId:
          type: string
    DatasetOfferingDto:
      type: object
      required:
      - dataset
      - distribution
      properties:
        dataset:
          $ref: '#/components/schemas/DatasetDto'
        distribution:
          $ref: '#/components/schemas/DistributionDto'
        policy:
          oneOf:
          - $ref: '#/components/schemas/OdrlPolicyDto'
          - type: 'null'
    DeadLetterRecord:
      type: object
      required:
      - id
      - tenant_id
      - event_id
      - subscription_id
      - topic
      - callback_address
      - payload
      - error_message
      - attempts
      - status
      - failed_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        delivery_id:
          type:
          - string
          - 'null'
        event_id:
          type: string
        subscription_id:
          type: string
        topic:
          type: string
        callback_address:
          type: string
        payload:
          description: Payload of the failed delivery.
        error_message:
          type: string
        attempts:
          type: integer
        status:
          type: string
          enum:
          - Unresolved
          - Replayed
          - Purged
        failed_at:
          type: string
          format: date-time
        replayed_at:
          type:
          - string
          - 'null'
          format: date-time
    DidDocument:
      type: object
      required:
      - '@context'
      - id
      - verificationMethod
      properties:
        '@context':
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        id:
          type: string
        controller: {}
        alsoKnownAs: {}
        service:
          type: array
          items:
            $ref: '#/components/schemas/DidService'
        verificationMethod:
          type: array
          items:
            type: object
        authentication: {}
        assertionMethod: {}
        keyAgreement: {}
        capabilityInvocation: {}
        capabilityDelegation: {}
    DidService:
      type: object
      required:
      - type
      - serviceEndpoint
      properties:
        id:
          type: string
          examples:
          - AuthorizationServer
          - CredentialIssuer
          - FederatedCatalog
        type:
          type: string
        serviceEndpoint:
          type: string
    Distribution:
      $ref: '#/components/schemas/DspDistribution'
    DistributionDto:
      type: object
      required:
      - id
      - tenantId
      - dctIssued
      - dcatAccessService
      - datasetId
      properties:
        id:
          type: string
          description: URN of the distribution.
        tenantId:
          type: string
        dctIssued:
          type: string
          format: date-time
        dctModified:
          type:
          - string
          - 'null'
          format: date-time
        dctTitle:
          type:
          - string
          - 'null'
        dctDescription:
          type:
          - string
          - 'null'
        dcatAccessService:
          type: string
          description: URN of the data service serving it.
        datasetId:
          type: string
        dctFormat:
          type:
          - string
          - 'null'
          examples:
          - HttpData-PULL
    DspCatalog:
      type: object
      description: DCAT catalog as sent over DSP.
      required:
      - '@context'
      - '@type'
      - '@id'
      - identifier
      - issued
      - catalog
      - dataset
      - service
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          examples:
          - Catalog
        '@id':
          type: string
        homepage:
          type: string
        theme:
          type: string
        keyword:
          type: string
        conformsTo:
          type: string
        creator:
          type: string
        identifier:
          type: string
        issued:
          type: string
          description: Naive timestamp, no zone.
        modified:
          type: string
        title:
          type: string
        description:
          type: array
          items:
            type: string
        participantId:
          type: string
        hasPolicy:
          type: array
          items:
            $ref: '#/components/schemas/OdrlOffer'
        extraFields: {}
        catalog:
          type: array
          description: Nested catalogs, full or minimized.
          items:
            type: object
        dataset:
          type: array
          items:
            $ref: '#/components/schemas/DspDataset'
        service:
          description: One data service, a minimized one, or a list.
          oneOf:
          - $ref: '#/components/schemas/DspDataService'
          - type: array
            items:
              $ref: '#/components/schemas/DspDataService'
    DspDataService:
      type: object
      description: Full data service, or a minimized one with only `@type`, `@id` and DCAT fields.
      required:
      - '@type'
      - '@id'
      - endpointURL
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          examples:
          - DataService
        '@id':
          type: string
        theme:
          type: string
        keyword:
          type: string
        endpointDescription:
          type: string
        endpointURL:
          type: string
        conformsTo:
          type: string
        creator:
          type: string
        identifier:
          type: string
        issued:
          type: string
        modified:
          type: string
        title:
          type: string
        description:
          type: array
          items:
            type: string
        hasPolicy:
          type: array
          items:
            $ref: '#/components/schemas/OdrlOffer'
        extraFields: {}
    DspDataset:
      type: object
      required:
      - '@type'
      - '@id'
      - identifier
      - issued
      - hasPolicy
      - distribution
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          examples:
          - Dataset
        '@id':
          type: string
        theme:
          type: string
        keyword:
          type: string
        conformsTo:
          type: string
        creator:
          type: string
        identifier:
          type: string
        issued:
          type: string
          description: Naive timestamp, no zone.
        modified:
          type: string
        title:
          type: string
        description:
          type: array
          items:
            type: string
        hasPolicy:
          type: array
          items:
            $ref: '#/components/schemas/OdrlOffer'
        extraFields: {}
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/DspDistribution'
    DspDistribution:
      type: object
      required:
      - '@type'
      - '@id'
      - issued
      - formats
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          examples:
          - Distribution
        '@id':
          type: string
        accessService:
          oneOf:
          - $ref: '#/components/schemas/DspDataService'
          - type: array
            items:
              $ref: '#/components/schemas/DspDataService'
          - type: 'null'
        issued:
          type: string
          description: Naive timestamp, no zone.
        modified:
          type: string
