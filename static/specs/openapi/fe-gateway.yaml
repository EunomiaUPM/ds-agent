  /oauth/authorize:
    get:
      tags:
      - OAuth
      operationId: authorizeOAuthGet
      summary: Issue a PKCE authorization code
      description: |
        Only `response_type=code` with a `code_challenge` is supported. Without `user_id`, the
        user is taken from the bearer token when one is sent.
      parameters:
      - name: response_type
        in: query
        required: true
        schema:
          type: string
          const: code
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
          enum:
          - S256
          - plain
      - name: user_id
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Authorization code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizeResponse'
        '400':
          $ref: '#/components/responses/OAuthErrorResponse'
      security: []
    post:
      tags:
      - OAuth
      operationId: authorizeOAuthPost
      summary: Issue a PKCE authorization code (body)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthAuthorizeRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthAuthorizeRequest'
      responses:
        '200':
          description: Authorization code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizeResponse'
        '400':
          $ref: '#/components/responses/OAuthErrorResponse'
      security: []
