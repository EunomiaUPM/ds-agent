openapi: 3.1.0
info:
  title: Eunomia DS Keystore API
  description: |
    Parameters and secrets of each user, with optimistic versioning (`crates/keystore`).
    Keys are path-like (`/connectors/http/token`): they start with `/`, have no empty segments
    and only use `a-z A-Z 0-9 _ - .`. In the URL the leading `/` is dropped, so
    `/api/v1/keystore/secrets/connectors/http/token` addresses `/connectors/http/token`.
    Secret values are write-only: every response shows them as `*****`.
  version: 1.1.0
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: http://127.0.0.1:1200
  description: Provider agent (dev)
- url: http://127.0.0.1:1100
  description: Consumer agent (dev)
security:
- bearerAuth: []
tags:
- name: Keystore Parameters
  description: Plain configuration values
- name: Keystore Secrets
  description: Write-only secret values
- name: Keystore Config
  description: Effective application configuration
paths:
  /api/v1/keystore/parameters:
    get:
      tags:
      - Keystore Parameters
      operationId: listParameters
      summary: List parameters
      parameters:
      - $ref: '#/components/parameters/KeyPrefix'
      - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: Parameters under the prefix
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeystoreParameterView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Keystore Parameters
      operationId: createParameter
      summary: Create a parameter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeystoreNewParameterCommand'
      responses:
        '201':
          description: Parameter created at version 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeystoreParameterView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/keystore/parameters/{key}:
    parameters:
    - $ref: '#/components/parameters/KeyPath'
    get:
      tags:
      - Keystore Parameters
      operationId: getParameter
      summary: Read a parameter
      responses:
        '200':
          description: Parameter with its value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeystoreParameterView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Keystore Parameters
      operationId: updateParameter
      summary: Update a parameter
      description: Rejected with 409 unless `expectedVersion` is the current version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeystoreEditParameterCommand'
      responses:
        '200':
          description: Version left by the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeystoreVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Keystore Parameters
      operationId: deleteParameter
      summary: Delete a parameter
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/keystore/secrets:
    get:
      tags:
      - Keystore Secrets
      operationId: listSecrets
      summary: List secrets
      parameters:
      - $ref: '#/components/parameters/KeyPrefix'
      - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: Secrets under the prefix, values masked
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeystoreSecretView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Keystore Secrets
      operationId: createSecret
      summary: Create a secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeystoreNewSecretCommand'
      responses:
        '201':
          description: Secret created at version 1, value masked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeystoreSecretView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/keystore/secrets/{key}:
    parameters:
    - $ref: '#/components/parameters/KeyPath'
    get:
      tags:
      - Keystore Secrets
      operationId: getSecret
      summary: Read a secret's metadata
      responses:
        '200':
          description: Secret, value masked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeystoreSecretView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Keystore Secrets
      operationId: updateSecret
      summary: Replace a secret's value
      description: Rejected with 409 unless `expectedVersion` is the current version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeystoreEditSecretCommand'
      responses:
        '200':
          description: Version left by the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeystoreVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Keystore Secrets
      operationId: deleteSecret
      summary: Delete a secret
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/keystore/config:
    get:
      tags:
      - Keystore Config
      operationId: getApplicationConfig
      summary: Effective application configuration
      responses:
        '200':
          description: Config file of the process, one optional section per agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeystoreApplicationConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth access token (JWT) or personal access token issued by `/oauth`.
  parameters:
    KeyPath:
      name: key
      in: path
      required: true
      description: Entry key without its leading `/`; may contain further `/` segments.
      schema:
        type: string
        examples:
        - connectors/http/token
    KeyPrefix:
      name: prefix
      in: query
      required: false
      description: Only entries whose key starts with this prefix.
      schema:
        type: string
        examples:
        - /connectors
    UserIdQuery:
      name: user_id
      in: query
      required: false
      description: Only the records of this user, among those the caller sees.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Conflict:
      description: The resource already exists or changed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Forbidden:
      description: The caller may not act on this tenant or resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
  schemas:
    ErrorInfo:
      type: object
      description: Error body returned by every agent.
      required:
      - message
      - error_code
      properties:
        message:
          type: string
        error_code:
          type: integer
          description: Internal error code of the failure kind.
        details:
          type:
          - string
          - 'null'
    KeystoreApplicationConfig:
      type: object
      description: One optional section per agent, as loaded from the config file.
      properties:
        '@context':
          description: '`https://w3id.org/eunomia/v1/keystore-context.jsonld`. Optional on input, where
            it is assumed; another context is refused.'
          oneOf:
          - type: string
            const: https://w3id.org/eunomia/v1/keystore-context.jsonld
          - type: array
            items:
              type: string
            contains:
              const: https://w3id.org/eunomia/v1/keystore-context.jsonld
        '@type':
          type: string
          const: ApplicationConfig
          description: '`ApplicationConfig`. Optional on input; another type is refused.'
        monolith:
          type:
          - object
          - 'null'
        transfer:
          type:
          - object
          - 'null'
        contracts:
          type:
          - object
          - 'null'
        catalog:
          type:
          - object
          - 'null'
        ssi_auth:
          type:
          - object
          - 'null'
        gateway:
          type:
          - object
          - 'null'
    KeystoreEditParameterCommand:
      type: object
      required:
      - value
      - expectedVersion
      properties:
        '@context':
          description: '`https://w3id.org/eunomia/v1/keystore-context.jsonld`. Optional on input, where
            it is assumed; another context is refused.'
          oneOf:
          - type: string
            const: https://w3id.org/eunomia/v1/keystore-context.jsonld
          - type: array
            items:
              type: string
            contains:
              const: https://w3id.org/eunomia/v1/keystore-context.jsonld
        '@type':
          type: string
          const: Parameter
          description: '`Parameter`. Optional on input; another type is refused.'
        value:
          description: Any JSON value.
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        description:
          type:
          - string
          - 'null'
    KeystoreEditSecretCommand:
      type: object
      required:
      - value
      - expectedVersion
      properties:
        '@context':
          description: '`https://w3id.org/eunomia/v1/keystore-context.jsonld`. Optional on input, where
            it is assumed; another context is refused.'
          oneOf:
          - type: string
            const: https://w3id.org/eunomia/v1/keystore-context.jsonld
          - type: array
            items:
              type: string
            contains:
              const: https://w3id.org/eunomia/v1/keystore-context.jsonld
        '@type':
          type: string
          const: Secret
          description: '`Secret`. Optional on input; another type is refused.'
        value:
          description: New secret content, any JSON value.
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        description:
          type:
          - string
          - 'null'
    KeystoreNewParameterCommand:
      type: object
      required:
      - key
      - value
      properties:
        '@context':
          description: '`https://w3id.org/eunomia/v1/keystore-context.jsonld`. Optional on input, where
            it is assumed; another context is refused.'
          oneOf:
          - type: string
            const: https://w3id.org/eunomia/v1/keystore-context.jsonld
          - type: array
            items:
              type: string
            contains:
              const: https://w3id.org/eunomia/v1/keystore-context.jsonld
        '@type':
          type: string
          const: Parameter
          description: '`Parameter`. Optional on input; another type is refused.'
        key:
          type: string
          pattern: ^(/[A-Za-z0-9_.-]+)+$
          examples:
          - /connectors/http/base-url
        value:
          description: Any JSON value.
        description:
          type:
          - string
          - 'null'
    KeystoreNewSecretCommand:
      type: object
      required:
      - key
      - value
      properties:
        '@context':
          description: '`https://w3id.org/eunomia/v1/keystore-context.jsonld`. Optional on input, where
            it is assumed; another context is refused.'
          oneOf:
          - type: string
            const: https://w3id.org/eunomia/v1/keystore-context.jsonld
          - type: array
            items:
              type: string
            contains:
              const: https://w3id.org/eunomia/v1/keystore-context.jsonld
        '@type':
          type: string
          const: Secret
          description: '`Secret`. Optional on input; another type is refused.'
        key:
          type: string
          pattern: ^(/[A-Za-z0-9_.-]+)+$
          examples:
          - /connectors/http/token
        value:
          description: Secret content, any JSON value.
        description:
          type:
          - string
          - 'null'
    KeystoreParameterView:
      type: object
      required:
      - key
      - version
      - value
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      properties:
        '@context':
          description: '`https://w3id.org/eunomia/v1/keystore-context.jsonld`. Optional on input, where
            it is assumed; another context is refused.'
          oneOf:
          - type: string
            const: https://w3id.org/eunomia/v1/keystore-context.jsonld
          - type: array
            items:
              type: string
            contains:
              const: https://w3id.org/eunomia/v1/keystore-context.jsonld
        '@type':
          type: string
          const: Parameter
          description: '`Parameter`. Optional on input; another type is refused.'
        key:
          type: string
          examples:
          - /connectors/http/base-url
        version:
          type: integer
          format: int64
          minimum: 1
        value:
          description: Any JSON value.
        description:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
    KeystoreSecretView:
      type: object
      required:
      - key
      - version
      - value
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      properties:
        '@context':
          description: '`https://w3id.org/eunomia/v1/keystore-context.jsonld`. Optional on input, where
            it is assumed; another context is refused.'
          oneOf:
          - type: string
            const: https://w3id.org/eunomia/v1/keystore-context.jsonld
          - type: array
            items:
              type: string
            contains:
              const: https://w3id.org/eunomia/v1/keystore-context.jsonld
        '@type':
          type: string
          const: Secret
          description: '`Secret`. Optional on input; another type is refused.'
        key:
          type: string
          examples:
          - /connectors/http/token
        version:
          type: integer
          format: int64
          minimum: 1
        value:
          type: string
          const: '*****'
          description: Always masked.
        description:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
    KeystoreVersionResponse:
      type: object
      required:
      - version
      properties:
        '@context':
          description: '`https://w3id.org/eunomia/v1/keystore-context.jsonld`. Optional on input, where
            it is assumed; another context is refused.'
          oneOf:
          - type: string
            const: https://w3id.org/eunomia/v1/keystore-context.jsonld
          - type: array
            items:
              type: string
            contains:
              const: https://w3id.org/eunomia/v1/keystore-context.jsonld
        '@type':
          type: string
          const: Version
          description: '`Version`. Optional on input; another type is refused.'
        version:
          type: integer
          format: int64
