openapi: 3.0.3
info:
  title: Eunomia Keystore API
  description: OpenAPI specification for the Eunomia Keystore — management of parameters (plain JSON values) and secrets (masked values).
  version: 1.0.0
servers:
  - url: /api/v1/keystore
    description: Base path for the Keystore API

tags:
  - name: Parameters
    description: Plain key/value entries with full JSON value support
  - name: Secrets
    description: Sensitive key/value entries — values are masked in all responses
  - name: Config
    description: Runtime application configuration

paths:
  # --- Parameters ---
  /parameters:
    get:
      tags:
        - Parameters
      summary: List parameters
      operationId: listParameters
      parameters:
        - $ref: "#/components/parameters/PrefixParam"
      responses:
        "200":
          description: List of parameters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParameterView"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Parameters
      summary: Create parameter
      operationId: createParameter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewParameterCommand"
      responses:
        "201":
          description: Parameter created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParameterView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /parameters/{key}:
    parameters:
      - $ref: "#/components/parameters/KeyParam"
    get:
      tags:
        - Parameters
      summary: Get parameter
      operationId: getParameter
      responses:
        "200":
          description: Parameter found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParameterView"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Parameters
      summary: Update parameter
      operationId: updateParameter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditParameterCommand"
      responses:
        "200":
          description: Parameter updated — returns new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Parameters
      summary: Delete parameter
      operationId: deleteParameter
      responses:
        "204":
          description: Parameter deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # --- Secrets ---
  /secrets:
    get:
      tags:
        - Secrets
      summary: List secrets
      description: Returns all secrets matching the optional prefix. Values are always masked as `"*****"`.
      operationId: listSecrets
      parameters:
        - $ref: "#/components/parameters/PrefixParam"
      responses:
        "200":
          description: List of secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecretView"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Secrets
      summary: Create secret
      operationId: createSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSecretCommand"
      responses:
        "201":
          description: Secret created. Value is masked in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /secrets/{key}:
    parameters:
      - $ref: "#/components/parameters/KeyParam"
    get:
      tags:
        - Secrets
      summary: Get secret
      description: Value is always masked as `"*****"`.
      operationId: getSecret
      responses:
        "200":
          description: Secret found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretView"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Secrets
      summary: Update secret
      operationId: updateSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSecretCommand"
      responses:
        "200":
          description: Secret updated — returns new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Secrets
      summary: Delete secret
      operationId: deleteSecret
      responses:
        "204":
          description: Secret deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # --- Config ---
  /config:
    get:
      tags:
        - Config
      summary: Get application config
      operationId: getApplicationConfig
      responses:
        "200":
          description: Current application configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationConfig"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    KeyParam:
      name: key
      in: path
      required: true
      description: |
        Path-style key in the format `/segment1/segment2/...`.
        Each segment may contain `[a-zA-Z0-9_.-]` characters.
        Examples: `/db/password`, `/service/api-key`, `/env/prod/db/host`
      schema:
        type: string
        pattern: '^(/[a-zA-Z0-9_.\\-]+)+$'
        example: /service/api-key

    PrefixParam:
      name: prefix
      in: query
      required: false
      description: |
        Filter results to keys that start with this prefix.
        Must be a valid path prefix, e.g. `/service` returns `/service/api-key` and `/service/db/host`.
      schema:
        type: string
        example: /service

  schemas:
    # --- Shared ---
    VersionResponse:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: New version number after the update
          example: 2

    # --- Parameters ---
    ParameterView:
      type: object
      required:
        - key
        - version
        - value
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
      properties:
        key:
          type: string
          description: Path-style key
          example: /service/timeout
        version:
          type: integer
          format: int64
          minimum: 1
          example: 1
        value:
          description: Any valid JSON value (string, number, boolean, array, object)
          example: 30
        description:
          type: string
          nullable: true
          example: Connection timeout in seconds
        createdAt:
          type: string
          format: date-time
          example: "2026-05-19T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-19T10:00:00Z"
        createdBy:
          type: string
          example: admin
        updatedBy:
          type: string
          example: admin

    NewParameterCommand:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          pattern: '^(/[a-zA-Z0-9_.\\-]+)+$'
          description: Path-style key
          example: /service/timeout
        value:
          description: Any valid JSON value
          example: 30
        description:
          type: string
          nullable: true
          example: Connection timeout in seconds

    EditParameterCommand:
      type: object
      required:
        - value
        - expectedVersion
      properties:
        value:
          description: New value (any valid JSON)
          example: 60
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
          description: Optimistic concurrency check — must match current version
          example: 1
        description:
          type: string
          nullable: true
          example: Connection timeout in seconds

    # --- Secrets ---
    SecretView:
      type: object
      required:
        - key
        - version
        - value
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
      properties:
        key:
          type: string
          description: Path-style key
          example: /db/password
        version:
          type: integer
          format: int64
          minimum: 1
          example: 1
        value:
          type: string
          description: Always masked — never returns the real value
          enum:
            - "*****"
          example: "*****"
        description:
          type: string
          nullable: true
          example: Production database password
        createdAt:
          type: string
          format: date-time
          example: "2026-05-19T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-19T10:00:00Z"
        createdBy:
          type: string
          example: admin
        updatedBy:
          type: string
          example: admin

    NewSecretCommand:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          pattern: '^(/[a-zA-Z0-9_.\\-]+)+$'
          description: Path-style key
          example: /db/password
        value:
          description: Secret value — any valid JSON (string, number, object, array)
          example: "s3cr3t!"
        description:
          type: string
          nullable: true
          example: Production database password

    EditSecretCommand:
      type: object
      required:
        - value
        - expectedVersion
      properties:
        value:
          description: New secret value — any valid JSON
          example: "n3w-s3cr3t!"
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
          description: Optimistic concurrency check — must match current version
          example: 1
        description:
          type: string
          nullable: true
          example: Production database password

    # --- Config ---
    ApplicationConfig:
      type: object
      description: Full runtime application configuration. Shape depends on deployment.
      additionalProperties: true

    # --- Errors ---
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Not found
        message:
          type: string
          example: Parameter '/service/timeout' not found

  responses:
    BadRequest:
      description: Invalid input (e.g. malformed key, missing field, wrong version)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Key not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Key already exists or optimistic lock conflict (version mismatch)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
