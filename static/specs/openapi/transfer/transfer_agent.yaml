openapi: 3.1.0
info:
  title: Eunomia DS Transfer Agent API
  description: |
    Management API of the transfer agent (`crates/transfer-agent`): the persisted record of
    transfer processes and their messages. The same routes are also mounted under
    `/api/v1/transfer-agent-ref`. Listings send the total in `X-Total-Count`.
  version: 1.0.0
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: http://127.0.0.1:1200
  description: Provider agent (dev)
- url: http://127.0.0.1:1100
  description: Consumer agent (dev)
security:
- bearerAuth: []
tags:
- name: Transfer Processes
  description: Transfer processes
- name: Transfer Messages
  description: DSP messages exchanged in a transfer
paths:
  /api/v1/transfer-agent/transfer-processes:
    get:
      tags:
      - Transfer Processes
      operationId: getTransferProcesses
      summary: List transfer processes
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/TenantIdQuery'
      - name: protocol
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TransferProtocolId'
      - name: state
        in: query
        required: false
        schema:
          type: string
          examples:
          - STARTED
      - name: role
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TransferRole'
      - name: agreement_id
        in: query
        required: false
        schema:
          type: string
      - name: peer_participant_id
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of transfer processes
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransferProcessDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Transfer Processes
      operationId: createTransferProcess
      summary: Create a transfer process record
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTransferProcessDto'
      responses:
        '201':
          description: Created transfer process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferProcessDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/transfer-agent/transfer-processes/batch:
    post:
      tags:
      - Transfer Processes
      operationId: getBatchTransferProcesses
      summary: Get several transfer processes by id
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequests'
      responses:
        '200':
          description: Transfer processes found
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransferProcessDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/transfer-agent/transfer-processes/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    - $ref: '#/components/parameters/TenantHeader'
    get:
      tags:
      - Transfer Processes
      operationId: getTransferProcessById
      summary: Get a transfer process
      responses:
        '200':
          description: Transfer process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferProcessDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Transfer Processes
      operationId: updateTransferProcess
      summary: Update a transfer process record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditTransferProcessDto'
      responses:
        '200':
          description: Updated transfer process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferProcessDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Transfer Processes
      operationId: deleteTransferProcess
      summary: Delete a transfer process record
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/transfer-agent/transfer-messages:
    get:
      tags:
      - Transfer Messages
      operationId: getTransferMessages
      summary: List transfer messages
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/TenantIdQuery'
      - name: direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TransferMessageDirection'
      - name: protocol
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TransferProtocolId'
      - name: state_transition_to
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Page of messages
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransferMessageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Transfer Messages
      operationId: createTransferMessage
      summary: Create a message record
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTransferMessageDto'
      responses:
        '201':
          description: Created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferMessageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/transfer-agent/transfer-messages/process/{process_id}:
    get:
      tags:
      - Transfer Messages
      operationId: getTransferMessagesByProcessId
      summary: Messages of a transfer process
      parameters:
      - $ref: '#/components/parameters/ProcessIdPath'
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/Sort'
      - name: direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TransferMessageDirection'
      - name: state_transition_to
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Page of messages
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransferMessageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/transfer-agent/transfer-messages/{id}:
    parameters:
    - $ref: '#/components/parameters/UrnPathId'
    - $ref: '#/components/parameters/TenantHeader'
    get:
      tags:
      - Transfer Messages
      operationId: getTransferMessageById
      summary: Get a message
      responses:
        '200':
          description: Message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferMessageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Transfer Messages
      operationId: deleteTransferMessage
      summary: Delete a message record
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth access token (JWT) or personal access token issued by `/oauth`.
  headers:
    XTotalCount:
      description: Total number of matching items.
      schema:
        type: integer
  parameters:
    CreatedAfter:
      name: created_after
      in: query
      required: false
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `nextCursor` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, clamped to 1..=100.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    PageNumber:
      name: page
      in: query
      required: false
      description: 1-based page index for offset paging, used when no cursor is sent.
      schema:
        type: integer
        minimum: 1
    ProcessIdPath:
      name: process_id
      in: path
      required: true
      description: URN of the process.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
        - created_at_asc
        - created_at_desc
        - updated_at_asc
        - updated_at_desc
        default: created_at_desc
    TenantHeader:
      name: x-tenant-id
      in: header
      required: false
      description: Tenant to act on. Non-admins may only name their own tenant.
      schema:
        type: string
    TenantIdQuery:
      name: tenant_id
      in: query
      required: false
      description: Tenant filter, honoured for admins.
      schema:
        type: string
    UrnPathId:
      name: id
      in: path
      required: true
      description: URN of the resource.
      schema:
        type: string
        examples:
        - urn:uuid:5b0f6a1e-2c3d-4e5f-8a9b-0c1d2e3f4a5b
  responses:
    BadRequest:
      description: Malformed request or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Forbidden:
      description: The caller may not act on this tenant or resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
  schemas:
    BatchRequests:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          description: URNs to look up.
          items:
            type: string
    EditTransferProcessDto:
      type: object
      properties:
        state:
          type:
          - string
          - 'null'
        stateMetadata:
          oneOf:
          - $ref: '#/components/schemas/TransferStateMetadata'
          - type: 'null'
        identifiers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        properties: {}
        errorDetails: {}
    ErrorInfo:
      type: object
      description: Error body returned by every agent.
      required:
      - message
      - error_code
      properties:
        message:
          type: string
        error_code:
          type: integer
          description: Internal error code of the failure kind.
        details:
          type:
          - string
          - 'null'
    NewTransferMessageDto:
      type: object
      required:
      - transferProcessId
      - direction
      - protocol
      - messageType
      - stateTransitionFrom
      - stateTransitionTo
      - envelope
      properties:
        id:
          type:
          - string
          - 'null'
          description: URN; generated when absent.
        transferProcessId:
          type: string
        tenantId:
          type:
          - string
          - 'null'
          description: Target tenant, honoured for admins.
        direction:
          $ref: '#/components/schemas/TransferMessageDirection'
        protocol:
          $ref: '#/components/schemas/TransferProtocolId'
        messageType:
          type: string
        stateTransitionFrom:
          type: string
        stateTransitionTo:
          type: string
        envelope:
          $ref: '#/components/schemas/TransferMessageEnvelope'
    NewTransferProcessDto:
      type: object
      required:
      - role
      - protocol
      - initialState
      - initialStateMetadata
      - agreementId
      - peerParticipantId
      properties:
        id:
          type:
          - string
          - 'null'
          description: URN; generated when absent.
        tenantId:
          type:
          - string
          - 'null'
          description: Target tenant, honoured for admins.
        role:
          $ref: '#/components/schemas/TransferRole'
        protocol:
          $ref: '#/components/schemas/TransferProtocolId'
        initialState:
          type: string
        initialStateMetadata:
          $ref: '#/components/schemas/TransferStateMetadata'
        callbackAddress:
          type:
          - string
          - 'null'
          format: uri
        connectorInstanceId:
          type:
          - string
          - 'null'
          description: Accepted and ignored.
        agreementId:
          type: string
          description: URN of the agreement.
        peerParticipantId:
          type: string
        identifiers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        properties: {}
    PaginatedTransferMessageDto:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransferMessageDto'
        nextCursor:
          type: string
          description: Absent on the last page.
        total:
          type: integer
    PaginatedTransferProcessDto:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransferProcessDto'
        nextCursor:
          type: string
          description: Absent on the last page.
        total:
          type: integer
    TransferCorrelation:
      type: object
      required:
      - identifiers
      properties:
        identifiers:
          type: object
          additionalProperties:
            type: string
        consumerPid:
          type:
          - string
          - 'null'
        providerPid:
          type:
          - string
          - 'null'
        agreementId:
          type:
          - string
          - 'null'
        callbackAddress:
          type:
          - string
          - 'null'
          format: uri
        peerParticipantId:
          type:
          - string
          - 'null'
    TransferMessageDirection:
      type: string
      enum:
      - inbound
      - outbound
    TransferMessageDto:
      type: object
      required:
      - id
      - transferProcessId
      - tenantId
      - direction
      - protocol
      - messageType
      - stateTransitionFrom
      - stateTransitionTo
      - envelope
      - occurredAt
      properties:
        id:
          type: string
          description: URN of the message.
        transferProcessId:
          type: string
        tenantId:
          type: string
        direction:
          $ref: '#/components/schemas/TransferMessageDirection'
        protocol:
          $ref: '#/components/schemas/TransferProtocolId'
        messageType:
          type: string
          examples:
          - TransferRequestMessage
        stateTransitionFrom:
          type: string
        stateTransitionTo:
          type: string
        envelope:
          $ref: '#/components/schemas/TransferMessageEnvelope'
        occurredAt:
          type: string
          format: date-time
    TransferMessageEnvelope:
      type: object
      required:
      - payload
      properties:
        canonicalForm:
          type:
          - string
          - 'null'
          description: URDNA2015 canonical N-Quads of a JSON-LD message.
        canonicalHash:
          type:
          - string
          - 'null'
          description: Hex SHA-256 of the canonical form.
        payload:
          description: The protocol message as sent or received.
    TransferProcessDto:
      type: object
      required:
      - id
      - tenantId
      - role
      - protocol
      - state
      - stateMetadata
      - correlation
      - properties
      - createdAt
      - updatedAt
      - version
      properties:
        id:
          type: string
          description: URN of the transfer process.
        tenantId:
          type: string
        role:
          $ref: '#/components/schemas/TransferRole'
        protocol:
          $ref: '#/components/schemas/TransferProtocolId'
        state:
          type: string
          description: Protocol state, e.g. `REQUESTED`, `STARTED`, `SUSPENDED`, `COMPLETED`, `TERMINATED`.
        stateMetadata:
          $ref: '#/components/schemas/TransferStateMetadata'
        correlation:
          $ref: '#/components/schemas/TransferCorrelation'
        properties:
          description: Free-form JSON.
        errorDetails:
          description: Last error, any JSON value.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic concurrency version.
    TransferProtocolId:
      type: string
      enum:
      - dsp2024
      - dsp2025_1
    TransferRole:
      type: string
      description: Capitalised forms are accepted on input.
      enum:
      - provider
      - consumer
      - relay
    TransferStateMetadata:
      type: object
      description: Attribute, reasons and code of the current state, such as a termination cause.
      properties:
        attribute:
          type:
          - string
          - 'null'
        reason:
          type:
          - array
          - 'null'
          items:
            type: string
        code:
          type:
          - string
          - 'null'
