openapi: 3.1.0
info:
  title: Eunomia DS Transfer Process Protocol API
  description: |
    Transfer Process Protocol of the Dataspace Protocol 2025-1 as served by the transfer agent.
    Bodies are JSON-LD: they are expanded against the DSP 2025-1 context, the message node is
    found by its `dspace:` type, and its fields go through the edge and domain validators.

    The handlers are being rebuilt on this pipeline: today an accepted message answers 202 and a
    rejected one 400, both without body, and `GET /{id}` is a placeholder. A missing or unknown
    peer token answers 404, the same as a missing process, so probing cannot reveal processes.
  version: 1.0.0
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: http://127.0.0.1:1200
  description: Provider agent (dev)
- url: http://127.0.0.1:1100
  description: Consumer agent (dev)
security:
- peerBearer: []
tags:
- name: Transfer Protocol
  description: DSP endpoints called by peers
paths:
  /dsp/current/transfers/request:
    post:
      tags:
      - Transfer Protocol
      operationId: transferRequest
      summary: Transfer request (provider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequestMessage'
      responses:
        '202':
          description: Accepted
        '400':
          description: Rejected by the pipeline (empty body)
        '404':
          description: Missing or unknown peer token (empty body)
  /dsp/current/transfers/{id}:
    get:
      tags:
      - Transfer Protocol
      operationId: getTransferProcess
      summary: Transfer process state (placeholder)
      parameters:
      - $ref: '#/components/parameters/PidPath'
      responses:
        '200':
          description: Placeholder answer `ok`
          content:
            text/plain:
              schema:
                type: string
                const: ok
        '404':
          description: Missing or unknown peer token (empty body)
  /dsp/current/transfers/{id}/start:
    post:
      tags:
      - Transfer Protocol
      operationId: transferStart
      summary: Transfer start (consumer, or provider when resuming)
      parameters:
      - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferStartMessage'
      responses:
        '202':
          description: Accepted
        '400':
          description: Rejected by the pipeline (empty body)
        '404':
          description: Missing or unknown peer token (empty body)
  /dsp/current/transfers/{id}/completion:
    post:
      tags:
      - Transfer Protocol
      operationId: transferCompletion
      summary: Transfer completion (either role)
      parameters:
      - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCompletionMessage'
      responses:
        '202':
          description: Accepted
        '400':
          description: Rejected by the pipeline (empty body)
        '404':
          description: Missing or unknown peer token (empty body)
  /dsp/current/transfers/{id}/suspension:
    post:
      tags:
      - Transfer Protocol
      operationId: transferSuspension
      summary: Transfer suspension (either role)
      parameters:
      - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferSuspensionMessage'
      responses:
        '202':
          description: Accepted
        '400':
          description: Rejected by the pipeline (empty body)
        '404':
          description: Missing or unknown peer token (empty body)
  /dsp/current/transfers/{id}/termination:
    post:
      tags:
      - Transfer Protocol
      operationId: transferTermination
      summary: Transfer termination (either role)
      parameters:
      - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferTerminationMessage'
      responses:
        '202':
          description: Accepted
        '400':
          description: Rejected by the pipeline (empty body)
        '404':
          description: Missing or unknown peer token (empty body)
components:
  securitySchemes:
    peerBearer:
      type: http
      scheme: bearer
      description: Token the peer obtained from this agent through GNAP onboarding.
  parameters:
    PidPath:
      name: id
      in: path
      required: true
      description: This agent's process id (`providerPid` on a provider, `consumerPid` on a consumer).
      schema:
        type: string
  schemas:
    ContextField:
      description: JSON-LD context; must include the DSP 2024-1 or 2025-1 context.
      oneOf:
      - type: string
      - type: array
        items:
          type: string
      examples:
      - https://w3id.org/dspace/2025/1/context.jsonld
    DataAddress:
      type: object
      required:
      - '@type'
      - endpointType
      - endpointProperties
      properties:
        '@type':
          type: string
          const: DataAddress
        endpointType:
          type: string
          examples:
          - https://w3id.org/idsa/v4.1/HTTP
        endpoint:
          type: string
          description: Optional; a pull request may get it in the start message.
        endpointProperties:
          type: array
          items:
            type: object
            required:
            - '@type'
            - name
            - value
            properties:
              '@type':
                type: string
                const: EndpointProperty
              name:
                type: string
              value:
                type: string
    TransferCompletionMessage:
      type: object
      required:
      - '@context'
      - '@type'
      - providerPid
      - consumerPid
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: TransferCompletionMessage
        providerPid:
          type: string
        consumerPid:
          type: string
    TransferRequestMessage:
      type: object
      required:
      - '@context'
      - '@type'
      - consumerPid
      - agreementId
      - format
      - callbackAddress
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: TransferRequestMessage
        consumerPid:
          type: string
        agreementId:
          type: string
        format:
          type: string
          description: '`dct:format` of a distribution of the agreement''s target.'
          examples:
          - HttpData-PULL
        dataAddress:
          $ref: '#/components/schemas/DataAddress'
        callbackAddress:
          type: string
    TransferStartMessage:
      type: object
      required:
      - '@context'
      - '@type'
      - providerPid
      - consumerPid
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: TransferStartMessage
        providerPid:
          type: string
        consumerPid:
          type: string
        dataAddress:
          $ref: '#/components/schemas/DataAddress'
    TransferSuspensionMessage:
      type: object
      required:
      - '@context'
      - '@type'
      - providerPid
      - consumerPid
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: TransferSuspensionMessage
        providerPid:
          type: string
        consumerPid:
          type: string
        code:
          type: string
        reason:
          type: array
          items:
            type: string
    TransferTerminationMessage:
      type: object
      required:
      - '@context'
      - '@type'
      - providerPid
      - consumerPid
      properties:
        '@context':
          $ref: '#/components/schemas/ContextField'
        '@type':
          type: string
          const: TransferTerminationMessage
        providerPid:
          type: string
        consumerPid:
          type: string
        code:
          type: string
        reason:
          type: array
          items:
            type: string
